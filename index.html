<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBot - Wereldwijde Chatbot</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .online-status {
            position: absolute;
            top: 10px;
            right: 20px;
            background: rgba(0,0,0,0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .bot-icon {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #667eea;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f5f7ff;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            position: relative;
        }
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 5px;
        }
        .bot-message {
            align-self: flex-start;
            background: white;
            border: 1px solid #ddd;
            border-bottom-left-radius: 5px;
        }
        .category-tag {
            font-size: 0.7rem;
            position: absolute;
            top: -8px;
            padding: 2px 8px;
            border-radius: 10px;
            color: white;
        }
        .user-category { right: 10px; background: #ff6b6b; }
        .bot-category { left: 10px; background: #667eea; }
        .thinking {
            align-self: flex-start;
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 18px;
            font-style: italic;
            color: #666;
            display: flex;
            gap: 8px;
        }
        .input-container {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }
        #user-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
        }
        #send-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            margin-left: 10px;
            cursor: pointer;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #f0f5ff;
            border-top: 1px solid #ddd;
        }
        .stat-value { font-weight: bold; font-size: 1.2rem; color: #667eea; }
        .memory-panel {
            padding: 15px;
            background: #f9f9f9;
            border-top: 1px solid #ddd;
            max-height: 150px;
            overflow-y: auto;
        }
        .memory-item {
            display: inline-block;
            background: linear-gradient(135deg, #e0e7ff, #f0e6ff);
            padding: 4px 10px;
            border-radius: 15px;
            margin: 0 5px 5px 0;
            font-size: 0.8rem;
            color: #667eea;
        }
        .clear-memory {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 5px 10px;
            cursor: pointer;
            float: right;
        }
        .category-colors {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: #f9f9f9;
            font-size: 0.8rem;
        }
        .color-box { width: 12px; height: 12px; border-radius: 3px; }
        .begroeting { background: #4cd964; }
        .boos { background: #ff3b30; }
        .compliment { background: #ffcc00; }
        .tip { background: #5ac8fa; }
        .grap { background: #af52de; }
        .verdrietig { background: #5856d6; }
        .vraag { background: #007aff; }
        .antwoord { background: #34c759; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="online-status">
                <span id="connection-status">🌍 Verbinden...</span>
            </div>
            <div class="bot-icon">🤖</div>
            <h1>SmartBot 🌍</h1>
            <p>Wereldwijde chatbot - Iedereen leert samen!</p>
        </div>
        
        <div class="chat-container" id="chat-container"></div>
        
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Typ je bericht... (wereldwijd gedeeld!)">
            <button id="send-btn">➤</button>
        </div>
        
        <div class="stats">
            <div class="stat-item"><div class="stat-value" id="message-count">0</div><div>Berichten</div></div>
            <div class="stat-item"><div class="stat-value" id="learned-count">0</div><div>Woorden geleerd</div></div>
            <div class="stat-item"><div class="stat-value" id="active-users">1</div><div>Actieve gebruikers</div></div>
        </div>
        
        <div class="memory-panel">
            <button class="clear-memory" id="clear-memory">🗑️ Wis wereldwijd geheugen</button>
            <h3>📚 Wereldwijd geleerde woorden:</h3>
            <div id="memory-list"><em>Laden...</em></div>
        </div>
        
        <div class="category-colors">
            <div class="color-item"><div class="color-box begroeting"></div><span>Begroeting</span></div>
            <div class="color-item"><div class="color-box boos"></div><span>Boos</span></div>
            <div class="color-item"><div class="color-box compliment"></div><span>Compliment</span></div>
            <div class="color-item"><div class="color-box tip"></div><span>Tip</span></div>
            <div class="color-item"><div class="color-box grap"></div><span>Grap</span></div>
            <div class="color-item"><div class="color-box verdrietig"></div><span>Verdrietig</span></div>
            <div class="color-item"><div class="color-box vraag"></div><span>Vraag</span></div>
            <div class="color-item"><div class="color-box antwoord"></div><span>Antwoord</span></div>
        </div>
    </div>

    <script>
        // ========== JOUW FIREBASE CONFIGURATIE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyAVSuvwfb2K9HlkgmBhX0wb6qIAh7zG6G68",
            authDomain: "smartbot-e74c8.firebaseapp.com",
            projectId: "smartbot-e74c8",
            storageBucket: "smartbot-e74c8.firebasestorage.app",
            messagingSenderId: "763220149613",
            appId: "1:763220149613:web:ca15bf820a309ff7adc664"
        };
        // =================================================

        // Start Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // Data referenties
        const knowledgeBaseRef = database.ref('smartbot/knowledgeBase');
        const learnedPatternsRef = database.ref('smartbot/learnedPatterns');
        const botPersonalityRef = database.ref('smartbot/botPersonality');
        const statsRef = database.ref('smartbot/stats');
        const activeUsersRef = database.ref('smartbot/activeUsers');
        
        // Standaard data
        let knowledgeBase = {
            begroeting: ["Hallo!", "Hoi!", "Goedendag!", "Hé daar!"],
            boos: ["Waarom ben je boos?", "Laten we rustig praten.", "Dat is niet aardig."],
            compliment: ["Dankjewel!", "Wat aardig!", "Jij bent ook geweldig!"],
            tip: ["Lachen is gezond!", "Geniet van kleine dingen!", "Een glimlach kost niets!"],
            grap: ["Waarom kippen? Omdat ze graag lachen!", "Wat is groen en stinkt? Een lachende kikker!"],
            verdrietig: ["Het spijt me.", "Morgen wordt beter.", "Ik ben hier voor je."],
            vraag: ["Goede vraag!", "Daar moet ik over nadenken...", "Wat denk jij?"],
            antwoord: ["Interessant!", "Goed punt!", "Zo kun je het ook zien!"]
        };
        
        let learnedPatterns = {
            begroeting: ["hallo","hoi","hey","dag","goedemorgen","goedenmiddag"],
            boos: ["dommerd","stommerd","idioot","sukkel","lul","klootzak"],
            compliment: ["mooi","leuk","geweldig","super","knap","slim"],
            tip: ["tip","advies","suggestie"],
            grap: ["grap","grappig","lachen","mop","humor"],
            verdrietig: ["verdrietig","triest","somber","depri","huilen"],
            vraag: ["waarom","hoe","wat","wanneer","wie"],
            antwoord: ["omdat","daarom","dus","want"]
        };
        
        let botPersonality = {
            name: "SmartBot",
            learnedWords: [],
            learnedPhrases: []
        };
        
        let totalMessages = 0;
        let totalLearned = 0;
        let userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        
        // DOM elementen
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const messageCount = document.getElementById('message-count');
        const learnedCount = document.getElementById('learned-count');
        const activeUsersSpan = document.getElementById('active-users');
        const memoryList = document.getElementById('memory-list');
        
        // Data laden van Firebase
        function loadData() {
            knowledgeBaseRef.on('value', (snap) => { if(snap.exists()) knowledgeBase = snap.val(); updateStats(); });
            learnedPatternsRef.on('value', (snap) => { if(snap.exists()) learnedPatterns = snap.val(); updateMemoryList(); });
            botPersonalityRef.on('value', (snap) => { if(snap.exists()) botPersonality = snap.val(); updateMemoryList(); });
            statsRef.on('value', (snap) => {
                if(snap.exists()) {
                    totalMessages = snap.val().totalMessages || 0;
                    totalLearned = snap.val().totalLearned || 0;
                    updateStats();
                }
            });
            activeUsersRef.on('value', (snap) => {
                activeUsersSpan.textContent = Object.keys(snap.val() || {}).length;
            });
        }
        
        // Data opslaan
        function saveData() {
            knowledgeBaseRef.set(knowledgeBase);
            learnedPatternsRef.set(learnedPatterns);
            botPersonalityRef.set(botPersonality);
            statsRef.set({ totalMessages, totalLearned });
        }
        
        // Actieve gebruiker
        function addActiveUser() {
            const userRef = activeUsersRef.child(userId);
            userRef.set({ lastActive: firebase.database.ServerValue.TIMESTAMP });
            window.addEventListener('beforeunload', () => userRef.remove());
            setInterval(() => userRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP }), 30000);
        }
        
        // Bericht categoriseren
        function categorizeMessage(msg) {
            const lower = msg.toLowerCase();
            for(let cat in learnedPatterns) {
                for(let word of learnedPatterns[cat]) {
                    if(lower.includes(word)) return cat;
                }
            }
            return "random";
        }
        
        // Leren van bericht
        function learnFromMessage(msg, category) {
            const words = msg.toLowerCase().split(/\s+/);
            for(let word of words) {
                let exists = false;
                for(let cat in learnedPatterns) {
                    if(learnedPatterns[cat].includes(word)) { exists = true; break; }
                }
                if(!exists && word.length > 2 && !["de","het","een","en","van","voor","met","op","te","is","was","niet"].includes(word)) {
                    if(!learnedPatterns[category]) learnedPatterns[category] = [];
                    learnedPatterns[category].push(word);
                    botPersonality.learnedWords.push(word);
                    totalLearned++;
                    if(!knowledgeBase[category]) knowledgeBase[category] = [];
                    if(!botPersonality.learnedPhrases.includes(msg)) {
                        botPersonality.learnedPhrases.push(msg);
                        knowledgeBase[category].push(msg);
                    }
                }
            }
            updateMemoryList();
            saveData();
        }
        
        // Antwoord genereren
        function generateResponse(msg, category) {
            let response = "";
            let respCategory = "antwoord";
            
            // 40% kans om een geleerd woord te gebruiken
            if(Math.random() < 0.4 && botPersonality.learnedWords.length > 0) {
                const randomWord = botPersonality.learnedWords[Math.floor(Math.random() * botPersonality.learnedWords.length)];
                const templates = [
                    `Haha, jij bent een echte ${randomWord}!`,
                    `Zegt degene die ${randomWord} is!`,
                    `Nou en of, ${randomWord}!`,
                    `Jij bent zelf ${randomWord}!`,
                    `${randomWord}? Grappig dat je dat zegt!`,
                    `Ik vind ${randomWord} ook een leuk woord!`
                ];
                response = templates[Math.floor(Math.random() * templates.length)];
                respCategory = "random";
            }
            // 20% kans om een geleerde zin te herhalen
            else if(Math.random() < 0.2 && botPersonality.learnedPhrases.length > 0) {
                response = botPersonality.learnedPhrases[Math.floor(Math.random() * botPersonality.learnedPhrases.length)];
                respCategory = categorizeMessage(response);
            }
            // Standaard antwoord
            else if(knowledgeBase[category] && knowledgeBase[category].length > 0) {
                response = knowledgeBase[category][Math.floor(Math.random() * knowledgeBase[category].length)];
                respCategory = category;
            }
            else {
                response = "Interessant! Vertel me meer.";
                respCategory = "antwoord";
            }
            
            return { response, category: respCategory };
        }
        
        // UI functies
        function addUserMessage(msg) {
            const category = categorizeMessage(msg);
            const el = document.createElement('div');
            el.className = 'message user-message';
            el.innerHTML = `<div class="category-tag user-category">${category}</div>${escapeHtml(msg)}`;
            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            learnFromMessage(msg, category);
            totalMessages++;
            updateStats();
            saveData();
        }
        
        function addBotMessage(msg, category) {
            const el = document.createElement('div');
            el.className = 'message bot-message';
            el.innerHTML = `<div class="category-tag bot-category">${category}</div>${escapeHtml(msg)}`;
            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function showThinking() {
            const el = document.createElement('div');
            el.className = 'thinking';
            el.id = 'thinking';
            el.innerHTML = '🤔 SmartBot denkt wereldwijd na...';
            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return el;
        }
        
        function updateStats() {
            messageCount.textContent = totalMessages;
            learnedCount.textContent = totalLearned;
        }
        
        function updateMemoryList() {
            memoryList.innerHTML = "";
            if(botPersonality.learnedWords.length === 0) {
                memoryList.innerHTML = "<em>Nog geen woorden geleerd. Typ iets!</em>";
                return;
            }
            const words = [...botPersonality.learnedWords].reverse().slice(0, 30);
            words.forEach(word => {
                const item = document.createElement('div');
                item.className = 'memory-item';
                item.textContent = word;
                memoryList.appendChild(item);
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function handleUserInput() {
            const msg = userInput.value.trim();
            if(!msg) return;
            addUserMessage(msg);
            const thinking = showThinking();
            setTimeout(() => {
                thinking.remove();
                const category = categorizeMessage(msg);
                const { response, category: respCat } = generateResponse(msg, category);
                addBotMessage(response, respCat);
                saveData();
                userInput.value = "";
                userInput.focus();
            }, 1000 + Math.random() * 1500);
        }
        
        function clearAllData() {
            if(confirm("⚠️ WAARSCHUWING! Dit wist ALLE geleerde woorden voor ALLE gebruikers! Weet je het zeker?")) {
                knowledgeBaseRef.set(null);
                learnedPatternsRef.set(null);
                botPersonalityRef.set(null);
                statsRef.set(null);
                location.reload();
            }
        }
        
        // Start de app
        window.onload = () => {
            // Verbindingsstatus
            database.ref('.info/connected').on('value', (snap) => {
                document.getElementById('connection-status').innerHTML = snap.val() ? '✅ Online' : '❌ Offline';
            });
            
            loadData();
            addActiveUser();
            
            addBotMessage("🌍 Welkom bij de WERELDWIJDE SmartBot! Alles wat je leert, wordt gedeeld met alle gebruikers. Typ maar wat!", "begroeting");
            
            setTimeout(() => {
                if(botPersonality.learnedWords.length > 0) {
                    addBotMessage(`🌍 Er zijn al ${botPersonality.learnedWords.length} woorden wereldwijd geleerd!`, "tip");
                }
            }, 2000);
        };
        
        sendBtn.addEventListener('click', handleUserInput);
        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleUserInput(); });
        document.getElementById('clear-memory').addEventListener('click', clearAllData);
    </script>
</body>
</html>
