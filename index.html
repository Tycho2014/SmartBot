<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBot - Wereldwijd Leren</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(90deg, #4a6cf7, #7a52d4);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .online-status {
            position: absolute;
            top: 10px;
            right: 20px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4cd964;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .bot-icon {
            width: 60px;
            height: 60px;
            background-color: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            color: #4a6cf7;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: pulse 2s infinite;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #f5f7ff;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            animation: messageSlide 0.3s ease;
            position: relative;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #4a6cf7, #7a52d4);
            color: white;
            border-bottom-right-radius: 5px;
            box-shadow: 2px 2px 8px rgba(74, 108, 247, 0.3);
        }

        .bot-message {
            align-self: flex-start;
            background-color: white;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
        }

        .category-tag {
            font-size: 0.7rem;
            position: absolute;
            top: -8px;
            padding: 2px 8px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }

        .user-category {
            right: 10px;
            background-color: #ff6b6b;
        }

        .bot-category {
            left: 10px;
            background-color: #4a6cf7;
        }

        .thinking {
            align-self: flex-start;
            background-color: #f0f0f0;
            padding: 10px 15px;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            font-style: italic;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: thinkingPulse 1.5s infinite;
        }

        .thinking-dots {
            display: flex;
            gap: 3px;
        }
        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #666;
            animation: dotPulse 1.5s infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.5); }
        }

        .input-container {
            display: flex;
            padding: 15px;
            background-color: white;
            border-top: 1px solid #e0e0e0;
        }

        #user-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
            transition: all 0.3s;
        }

        #user-input:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 2px rgba(74, 108, 247, 0.2);
        }

        #send-btn {
            background: linear-gradient(135deg, #4a6cf7, #7a52d4);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(74, 108, 247, 0.3);
        }
        #send-btn:hover { transform: scale(1.05); }
        #send-btn:active { transform: scale(0.95); }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background-color: #f0f5ff;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9rem;
            color: #555;
        }
        .stat-item { text-align: center; }
        .stat-value { font-weight: bold; font-size: 1.2rem; color: #4a6cf7; }

        .memory-panel {
            padding: 15px;
            background-color: #f9f9f9;
            border-top: 1px solid #e0e0e0;
            max-height: 150px;
            overflow-y: auto;
        }
        .memory-panel h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .memory-item {
            display: inline-block;
            background-color: #e6eeff;
            padding: 4px 10px;
            border-radius: 15px;
            margin: 0 5px 5px 0;
            font-size: 0.8rem;
            color: #4a6cf7;
            animation: memoryFadeIn 0.5s ease;
        }
        @keyframes memoryFadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .clear-memory {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .clear-memory:hover {
            background-color: #ff5252;
            transform: scale(1.05);
        }

        .category-colors {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background-color: #f9f9f9;
            border-top: 1px solid #e0e0e0;
            font-size: 0.8rem;
        }
        .color-item { display: flex; align-items: center; gap: 5px; }
        .color-box { width: 12px; height: 12px; border-radius: 3px; }
        .begroeting { background-color: #4cd964; }
        .boos { background-color: #ff3b30; }
        .compliment { background-color: #ffcc00; }
        .tip { background-color: #5ac8fa; }
        .grap { background-color: #af52de; }
        .verdrietig { background-color: #5856d6; }
        .vraag { background-color: #007aff; }
        .antwoord { background-color: #34c759; }
        .random { background-color: #8e8e93; }

        @media (max-width: 600px) {
            .container { border-radius: 10px; }
            .header h1 { font-size: 1.8rem; }
            .message { max-width: 90%; }
            .stats { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="online-status">
            <div class="status-dot"></div>
            <span id="connectionLabel">Verbinden...</span>
        </div>
        <div class="bot-icon">🤖</div>
        <h1>SmartBot 🌍</h1>
        <p>Wereldwijd leren – ieder woord telt!</p>
    </div>

    <div class="chat-container" id="chat-container"></div>

    <div class="input-container">
        <input type="text" id="user-input" placeholder="Typ je bericht... (wereldwijd gedeeld)">
        <button id="send-btn">➤</button>
    </div>

    <div class="stats">
        <div class="stat-item"><div class="stat-value" id="message-count">0</div><div>Berichten</div></div>
        <div class="stat-item"><div class="stat-value" id="learned-count">0</div><div>Woorden geleerd</div></div>
        <div class="stat-item"><div class="stat-value" id="active-users">?</div><div>Actieve gebruikers</div></div>
    </div>

    <div class="memory-panel">
        <h3>📚 Wereldwijd geleerde woorden
            <button class="clear-memory" id="clear-memory">Wis wereldwijd geheugen</button>
        </h3>
        <div id="memory-list"><em>Laden...</em></div>
    </div>

    <div class="category-colors">
        <div class="color-item"><div class="color-box begroeting"></div><span>Begroeting</span></div>
        <div class="color-item"><div class="color-box boos"></div><span>Boos</span></div>
        <div class="color-item"><div class="color-box compliment"></div><span>Compliment</span></div>
        <div class="color-item"><div class="color-box tip"></div><span>Tip</span></div>
        <div class="color-item"><div class="color-box grap"></div><span>Grap/humor</span></div>
        <div class="color-item"><div class="color-box verdrietig"></div><span>Verdrietig</span></div>
        <div class="color-item"><div class="color-box vraag"></div><span>Vraag</span></div>
        <div class="color-item"><div class="color-box antwoord"></div><span>Antwoord</span></div>
    </div>
</div>

<script>
    // ========== FIREBASE CONFIG (jouw project met europese database) ==========
    const firebaseConfig = {
        apiKey: "AIzaSyAVSuvwfb2K9HlkgmBhX0wb6qIAh7zG6G68",
        authDomain: "smartbot-e74c8.firebaseapp.com",
        databaseURL: "https://smartbot-e74c8-default-rtdb.europe-west1.firebasedatabase.app", // ✅ juiste regio
        projectId: "smartbot-e74c8",
        storageBucket: "smartbot-e74c8.firebasestorage.app",
        messagingSenderId: "763220149613",
        appId: "1:763220149613:web:ca15bf820a309ff7adc664"
    };
    // =========================================================================

    // Initialiseer Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Referenties naar globale data
    const knowledgeBaseRef = db.ref('smartbot/knowledgeBase');
    const learnedPatternsRef = db.ref('smartbot/learnedPatterns');
    const botPersonalityRef = db.ref('smartbot/botPersonality');
    const statsRef = db.ref('smartbot/stats');
    const activeUsersRef = db.ref('smartbot/activeUsers');

    // ---------- Standaard data (indien leeg in Firebase) ----------
    const defaultKnowledgeBase = {
        begroeting: ["Hallo! Leuk je te ontmoeten!", "Hoi! Hoe gaat het?", "Goedendag! Klaar voor een leuk gesprek?", "Hé daar! Wat leuk dat je er bent!"],
        boos: ["Waarom ben je zo boos?", "Laten we rustig praten.", "Ik begrijp dat je boos bent, maar schelden helpt niet.", "Oei, dat klinkt niet vriendelijk."],
        compliment: ["Wat aardig van je! Dankjewel!", "Dank je wel, dat waardeer ik!", "Wat een leuk compliment! Jij bent ook geweldig!", "Dankjewel, dat maakt me blij!"],
        tip: ["Weet je wat leuk is? Lachen is gezond!", "Een goede tip: geniet van de kleine dingen!", "Probeer eens iets nieuws vandaag!", "Een glimlach kost niets, maar is veel waard!"],
        grap: ["Waarom gaan programmeurs altijd met de verkeerde voet uit bed? Omdat ze alerts gebruiken!", "Hoe noem je een koe zonder poten? Grondrund!", "Waarom kon de computer niet eten? Hij had te veel cookies!", "Twee nullen staan te praten. Zegt de een tegen de ander: Ben jij ook niets?"],
        verdrietig: ["Het spijt me dat je je zo voelt.", "Soms hebben we gewoon een slechte dag. Morgen wordt beter!", "Ik ben hier voor je, ook al ben ik maar een bot.", "Het is oké om je verdrietig te voelen. Iedereen heeft dat wel eens."],
        vraag: ["Dat is een interessante vraag!", "Daar zou ik even over moeten nadenken...", "Goede vraag! Wat denk jij zelf?", "Daar kan ik lang over praten!"],
        antwoord: ["Dat is een goed antwoord!", "Interessant perspectief!", "Daar had ik nog niet aan gedacht!", "Zo kun je het ook zien!"]
    };
    const defaultLearnedPatterns = {
        begroeting: ["hallo","hoi","hey","goedendag","dag","goedemorgen","goedenmiddag","goedenavond"],
        boos: ["dommerd","stommerd","idioot","sukkel","lul","klootzak","kut"],
        compliment: ["mooi","leuk","geweldig","fantastisch","super","knap","slim","grappig"],
        tip: ["tip","advies","suggestie","idee","aanrader"],
        grap: ["grap","grappig","lachen","mop","humor","lach"],
        verdrietig: ["verdrietig","triest","somber","depri","huilen","zielig"],
        vraag: ["waarom","hoe","wat","wanneer","wie","welke"],
        antwoord: ["omdat","daarom","dus","want","om"]
    };
    const defaultBotPersonality = {
        name: "SmartBot",
        mood: "blij",
        favoriteWords: ["leuk", "interessant", "geweldig", "grappig"],
        learnedPhrases: [],
        learnedWords: []
    };
    const defaultStats = { totalMessages: 0, totalLearned: 0 };

    // Lokale variabelen (worden gesynchroniseerd)
    let knowledgeBase = { ...defaultKnowledgeBase };
    let learnedPatterns = JSON.parse(JSON.stringify(defaultLearnedPatterns));
    let botPersonality = JSON.parse(JSON.stringify(defaultBotPersonality));
    let totalMessages = 0;
    let totalLearned = 0;

    // UI elementen
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const messageCountSpan = document.getElementById('message-count');
    const learnedCountSpan = document.getElementById('learned-count');
    const activeUsersSpan = document.getElementById('active-users');
    const memoryListDiv = document.getElementById('memory-list');
    const clearMemoryBtn = document.getElementById('clear-memory');
    const connectionLabel = document.getElementById('connectionLabel');

    // Unieke sessie ID voor actieve gebruikers
    const sessionId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);

    // ---------- Firebase synchronisatie ----------
    function initFirebaseSync() {
        // KnowledgeBase
        knowledgeBaseRef.on('value', (snap) => {
            if (snap.exists()) knowledgeBase = snap.val();
            else knowledgeBaseRef.set(defaultKnowledgeBase);
        });
        // LearnedPatterns
        learnedPatternsRef.on('value', (snap) => {
            if (snap.exists()) learnedPatterns = snap.val();
            else learnedPatternsRef.set(defaultLearnedPatterns);
        });
        // BotPersonality
        botPersonalityRef.on('value', (snap) => {
            if (snap.exists()) botPersonality = snap.val();
            else botPersonalityRef.set(defaultBotPersonality);
            updateMemoryUI();
        });
        // Stats
        statsRef.on('value', (snap) => {
            if (snap.exists()) {
                totalMessages = snap.val().totalMessages || 0;
                totalLearned = snap.val().totalLearned || 0;
            } else {
                statsRef.set(defaultStats);
                totalMessages = 0;
                totalLearned = 0;
            }
            updateStatsUI();
        });
        // Actieve gebruikers
        activeUsersRef.on('value', (snap) => {
            const count = snap.exists() ? Object.keys(snap.val()).length : 0;
            activeUsersSpan.innerText = count;
        });
    }

    // Opslaan van geleerde data naar Firebase
    function syncToFirebase() {
        knowledgeBaseRef.set(knowledgeBase);
        learnedPatternsRef.set(learnedPatterns);
        botPersonalityRef.set(botPersonality);
        statsRef.set({ totalMessages, totalLearned });
    }

    // Actieve gebruiker registreren
    function registerActiveUser() {
        const userRef = activeUsersRef.child(sessionId);
        userRef.set({ lastActive: firebase.database.ServerValue.TIMESTAMP });
        window.addEventListener('beforeunload', () => userRef.remove());
        setInterval(() => {
            userRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP });
        }, 30000);
        // Verwijder oude sessies (ouder dan 1 minuut) elke minuut
        setInterval(() => {
            const oneMinuteAgo = Date.now() - 60000;
            activeUsersRef.once('value', (snapshot) => {
                const users = snapshot.val() || {};
                for (const [id, data] of Object.entries(users)) {
                    if (data.lastActive && data.lastActive < oneMinuteAgo) {
                        activeUsersRef.child(id).remove();
                    }
                }
            });
        }, 60000);
    }

    // ---------- Helper functies (categoriseren, leren, antwoorden) ----------
    function categorizeMessage(msg) {
        const lower = msg.toLowerCase();
        for (let cat in learnedPatterns) {
            for (let word of learnedPatterns[cat]) {
                if (lower.includes(word)) return cat;
            }
        }
        return "random";
    }

    function isCommonWord(word) {
        const common = ["de","het","een","en","of","maar","dan","om","naar","voor","met","zonder","door","over","onder","boven","tussen","naast","achter","bij","sinds","tot","van","aan","in","uit","op","te","is","was","zijn","niet","geen"];
        return common.includes(word.toLowerCase());
    }

    function learnFromMessage(msg, category) {
        const words = msg.toLowerCase().split(/\s+/);
        let changed = false;
        for (let word of words) {
            let exists = false;
            for (let cat in learnedPatterns) {
                if (learnedPatterns[cat].includes(word)) { exists = true; break; }
            }
            if (!exists && word.length > 2 && !isCommonWord(word)) {
                if (!learnedPatterns[category]) learnedPatterns[category] = [];
                learnedPatterns[category].push(word);
                botPersonality.learnedWords.push(word);
                totalLearned++;
                if (!knowledgeBase[category]) knowledgeBase[category] = [];
                if (!botPersonality.learnedPhrases.includes(msg)) {
                    botPersonality.learnedPhrases.push(msg);
                    knowledgeBase[category].push(msg);
                }
                changed = true;
            }
        }
        if (changed) {
            updateMemoryUI();
            syncToFirebase();
        }
    }

    function generateBotResponse(userMsg, userCategory) {
        let response = "";
        let respCategory = "antwoord";
        // 40% kans om een geleerd woord te gebruiken
        if (Math.random() < 0.4 && botPersonality.learnedWords.length > 0) {
            const randomWord = botPersonality.learnedWords[Math.floor(Math.random() * botPersonality.learnedWords.length)];
            let wordCat = "antwoord";
            for (let cat in learnedPatterns) {
                if (learnedPatterns[cat].includes(randomWord)) { wordCat = cat; break; }
            }
            const templates = {
                begroeting: [`Hallo! Jij bent ook een ${randomWord}!`, `Hé ${randomWord}! Hoe gaat het?`],
                boos: [`Jij bent zelf een ${randomWord}!`, `Niet zo ${randomWord} doen!`],
                compliment: [`Wat ben jij een ${randomWord}!`, `Jij bent echt ${randomWord}!`],
                tip: [`Mijn tip: gebruik vaker het woord ${randomWord}!`, `Probeer eens ${randomWord}, dat is leuk!`],
                grap: [`Waarom is een ${randomWord} zoals een banaan? Omdat ze allebei krom zijn!`],
                verdrietig: [`Ik voel me zo ${randomWord} vandaag.`, `Het is zo ${randomWord} soms.`],
                vraag: [`Waarom ben je zo ${randomWord}?`, `Wat vind je van ${randomWord}?`],
                antwoord: [`Ik denk dat ${randomWord} het antwoord is!`, `Volgens mij is het gewoon ${randomWord}.`],
                random: [`Leuk woord: ${randomWord}!`, `Ik hou van het woord ${randomWord}!`]
            };
            const arr = templates[wordCat] || templates.random;
            response = arr[Math.floor(Math.random() * arr.length)];
            respCategory = wordCat;
        }
        // 20% kans om een volledige geleerde zin te herhalen
        else if (Math.random() < 0.2 && botPersonality.learnedPhrases.length > 0) {
            response = botPersonality.learnedPhrases[Math.floor(Math.random() * botPersonality.learnedPhrases.length)];
            respCategory = categorizeMessage(response);
        }
        // Standaard antwoord uit knowledgeBase
        else {
            if (knowledgeBase[userCategory] && knowledgeBase[userCategory].length > 0) {
                response = knowledgeBase[userCategory][Math.floor(Math.random() * knowledgeBase[userCategory].length)];
                respCategory = userCategory;
            } else {
                const fallbacks = ["Interessant! Vertel me meer.", "Daar moet ik even over nadenken...", "Leuk! Wat vind je zelf?"];
                response = fallbacks[Math.floor(Math.random() * fallbacks.length)];
                respCategory = "antwoord";
            }
        }
        // 15% kans om een grap toe te voegen
        if (Math.random() < 0.15 && knowledgeBase.grap && knowledgeBase.grap.length) {
            response += " " + knowledgeBase.grap[Math.floor(Math.random() * knowledgeBase.grap.length)];
            respCategory = "grap";
        }
        return { response, category: respCategory };
    }

    // ---------- UI berichten ----------
    function addUserMessageToUI(text, category) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message user-message';
        msgDiv.innerHTML = `<div class="category-tag user-category">${category}</div>${escapeHtml(text)}`;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addBotMessageToUI(text, category) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot-message';
        msgDiv.innerHTML = `<div class="category-tag bot-category">${category}</div>${escapeHtml(text)}`;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showThinking() {
        const thinkDiv = document.createElement('div');
        thinkDiv.className = 'thinking';
        thinkDiv.id = 'temp-thinking';
        thinkDiv.innerHTML = `SmartBot denkt na <div class="thinking-dots"><span></span><span></span><span></span></div>`;
        chatContainer.appendChild(thinkDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return thinkDiv;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function updateStatsUI() {
        messageCountSpan.innerText = totalMessages;
        learnedCountSpan.innerText = totalLearned;
        let catCount = Object.keys(knowledgeBase).filter(k => knowledgeBase[k].length > 0).length;
        document.getElementById('category-count').innerText = catCount;
    }

    function updateMemoryUI() {
        if (!memoryListDiv) return;
        memoryListDiv.innerHTML = "";
        if (!botPersonality.learnedWords || botPersonality.learnedWords.length === 0) {
            memoryListDiv.innerHTML = "<em>Nog geen woorden geleerd. Typ iets!</em>";
            return;
        }
        const recent = [...botPersonality.learnedWords].reverse().slice(0, 30);
        recent.forEach(w => {
            const span = document.createElement('div');
            span.className = 'memory-item';
            span.textContent = w;
            memoryListDiv.appendChild(span);
        });
    }

    // ---------- Hoofdverwerking gebruikersbericht ----------
    function handleUserInput() {
        const message = userInput.value.trim();
        if (message === "") return;

        // Toon gebruikersbericht
        const userCat = categorizeMessage(message);
        addUserMessageToUI(message, userCat);
        userInput.value = "";

        // Leer van bericht (lokaal + sync)
        learnFromMessage(message, userCat);
        totalMessages++;
        updateStatsUI();
        syncToFirebase();

        // Denk-animatie en antwoord
        const thinkingDiv = showThinking();
        setTimeout(() => {
            thinkingDiv.remove();
            const category = categorizeMessage(message);
            const { response, category: respCat } = generateBotResponse(message, category);
            addBotMessageToUI(response, respCat);
            // Sla het bot-antwoord niet op in de leerdata (alleen gebruikersberichten)
            syncToFirebase(); // eventueel opnieuw sync voor de statistieken
        }, 1000 + Math.random() * 1500);
    }

    // Wis ALLE wereldwijde data (alleen voor admin)
    function wipeGlobalMemory() {
        if (confirm("⚠️ WAARSCHUWING! Dit wist ALLE geleerde woorden en zinnen voor ALLE gebruikers. Onomkeerbaar! Weet je het zeker?")) {
            knowledgeBaseRef.set(defaultKnowledgeBase);
            learnedPatternsRef.set(defaultLearnedPatterns);
            botPersonalityRef.set(defaultBotPersonality);
            statsRef.set(defaultStats);
            // Lokale variabelen ook resetten
            knowledgeBase = JSON.parse(JSON.stringify(defaultKnowledgeBase));
            learnedPatterns = JSON.parse(JSON.stringify(defaultLearnedPatterns));
            botPersonality = JSON.parse(JSON.stringify(defaultBotPersonality));
            totalMessages = 0;
            totalLearned = 0;
            updateStatsUI();
            updateMemoryUI();
            addBotMessageToUI("🌍 Wereldwijd geheugen is gewist! Iedereen begint opnieuw.", "tip");
        }
    }

    // ---------- Start van de app ----------
    window.onload = () => {
        initFirebaseSync();
        registerActiveUser();

        // Verbindingsstatus
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if (snap.val()) {
                connectionLabel.innerHTML = '✅ Online (wereldwijd)';
                document.querySelector('.status-dot').style.backgroundColor = '#4cd964';
                addBotMessageToUI("🌍 Verbonden met wereldwijde database! Alles wat je leert, zien anderen ook.", "begroeting");
            } else {
                connectionLabel.innerHTML = '❌ Offline - alleen lokaal';
                document.querySelector('.status-dot').style.backgroundColor = '#ff3b30';
                addBotMessageToUI("⚠️ Geen verbinding met Firebase. Je berichten worden niet wereldwijd gedeeld.", "tip");
            }
        });

        // Event listeners
        sendBtn.addEventListener('click', handleUserInput);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUserInput(); });
        clearMemoryBtn.addEventListener('click', wipeGlobalMemory);

        // Toon welkomstbericht
        addBotMessageToUI("Hallo! Ik ben SmartBot, je wereldwijde gesprekspartner. Ik leer van iedereen! Typ gewoon iets.", "begroeting");
    };
</script>
</body>
</html>
