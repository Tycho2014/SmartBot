<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBot - Wereldwijd Leren met Voorrang</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        /* Licht thema (standaard) */
        :root {
            --bg-gradient-start: #6e8efb;
            --bg-gradient-end: #a777e3;
            --container-bg: rgba(255,255,255,0.95);
            --chat-bg: #f5f7ff;
            --user-msg-start: #4a6cf7;
            --user-msg-end: #7a52d4;
            --bot-msg-bg: white;
            --bot-msg-border: #ddd;
            --text-color: #333;
            --input-bg: white;
            --input-border: #ddd;
            --stats-bg: #f0f5ff;
            --memory-bg: #f9f9f9;
            --thinking-bg: #f0f0f0;
            --thinking-color: #666;
        }
        
        /* Donker thema */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient-start: #1a1a2e;
                --bg-gradient-end: #16213e;
                --container-bg: rgba(30,30,46,0.95);
                --chat-bg: #1e1e2e;
                --user-msg-start: #4a6cf7;
                --user-msg-end: #7a52d4;
                --bot-msg-bg: #2d2d3f;
                --bot-msg-border: #404055;
                --text-color: #e0e0e0;
                --input-bg: #2d2d3f;
                --input-border: #404055;
                --stats-bg: #252538;
                --memory-bg: #252538;
                --thinking-bg: #2d2d3f;
                --thinking-color: #aaa;
            }
        }
        
        body { 
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end)); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 0; 
            margin: 0; 
        }
        
        .container { 
            width: 100%; 
            max-width: 100%; 
            background: var(--container-bg); 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            overflow: hidden; 
            border-radius: 0; 
        }
        
        .header { 
            background: linear-gradient(90deg, #4a6cf7, #7a52d4); 
            color: white; 
            padding: 20px; 
            text-align: center; 
            position: relative; 
        }
        
        .header-buttons {
            position: absolute;
            top: 10px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        
        .disclaimer-btn {
            background: rgba(0,0,0,0.4);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .disclaimer-btn:hover {
            background: rgba(0,0,0,0.6);
        }
        
        .online-status { 
            position: absolute; 
            top: 10px; 
            right: 20px; 
            background: rgba(0,0,0,0.4); 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        
        .status-dot { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            background: #4cd964; 
            animation: pulse 1.5s infinite; 
        }
        
        @keyframes pulse { 
            0% { opacity: 0.4; transform: scale(0.8); } 
            100% { opacity: 1; transform: scale(1.2); } 
        }
        
        .bot-icon { 
            width: 60px; 
            height: 60px; 
            background: white; 
            border-radius: 50%; 
            margin: 0 auto 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.8rem; 
            color: #4a6cf7; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            animation: bounce 2s infinite; 
        }
        
        @keyframes bounce { 
            0%,100% { transform: translateY(0); } 
            50% { transform: translateY(-5px); } 
        }
        
        .chat-container { 
            height: 400px; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background: var(--chat-bg); 
            width: 100%; 
        }
        
        .message { 
            max-width: 80%; 
            padding: 12px 18px; 
            border-radius: 18px; 
            position: relative;
            color: var(--text-color);
        }
        
        .user-message { 
            align-self: flex-end; 
            background: linear-gradient(135deg, var(--user-msg-start), var(--user-msg-end)); 
            color: white; 
            border-bottom-right-radius: 5px; 
        }
        
        .bot-message { 
            align-self: flex-start; 
            background: var(--bot-msg-bg); 
            border: 1px solid var(--bot-msg-border); 
            border-bottom-left-radius: 5px; 
        }
        
        .category-tag { 
            font-size: 0.7rem; 
            position: absolute; 
            top: -8px; 
            padding: 2px 8px; 
            border-radius: 10px; 
            color: white; 
            font-weight: bold; 
        }
        
        .user-category { 
            right: 10px; 
            background: #ff6b6b; 
        }
        
        .bot-category { 
            left: 10px; 
            background: #4a6cf7; 
        }
        
        /* Nieuwe type-animatie */
        .typing-indicator {
            align-self: flex-start;
            background: var(--thinking-bg);
            padding: 12px 18px;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--thinking-color);
            animation: typing 1.4s infinite;
        }
        
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
        
        .typing-text {
            color: var(--thinking-color);
            font-style: italic;
        }
        
        .input-container { 
            display: flex; 
            padding: 15px; 
            background: var(--input-bg); 
            border-top: 1px solid var(--input-border); 
        }
        
        #user-input { 
            flex: 1; 
            padding: 12px 15px; 
            border: 1px solid var(--input-border); 
            border-radius: 25px; 
            outline: none; 
            background: var(--input-bg);
            color: var(--text-color);
        }
        
        #send-btn { 
            background: linear-gradient(135deg, #4a6cf7, #7a52d4); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            margin-left: 10px; 
            cursor: pointer; 
        }
        
        .stats { 
            display: flex; 
            justify-content: space-around; 
            padding: 15px; 
            background: var(--stats-bg); 
            border-top: 1px solid var(--input-border); 
            color: var(--text-color);
        }
        
        .stat-value { 
            font-weight: bold; 
            font-size: 1.2rem; 
            color: #4a6cf7; 
        }
        
        .memory-panel { 
            padding: 15px; 
            background: var(--memory-bg); 
            border-top: 1px solid var(--input-border); 
            max-height: 150px; 
            overflow-y: auto; 
        }
        
        .memory-item { 
            display: inline-block; 
            background: #e6eeff; 
            padding: 4px 10px; 
            border-radius: 15px; 
            margin: 0 5px 5px 0; 
            font-size: 0.8rem; 
            color: #4a6cf7; 
        }
        
        .clear-memory { 
            background: #ff6b6b; 
            color: white; 
            border: none; 
            border-radius: 15px; 
            padding: 5px 10px; 
            cursor: pointer; 
            float: right; 
        }
        
        @media (max-width: 600px) { 
            .message { max-width: 90%; } 
            .stats { flex-direction: column; gap: 10px; } 
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-buttons">
            <button class="disclaimer-btn" id="disclaimerBtn">⚠️ Disclaimer</button>
        </div>
        <div class="online-status"><div class="status-dot"></div><span id="connectionLabel">Verbinden...</span></div>
        <div class="bot-icon">🤖</div>
        <h1>SmartBot</h1>
        <p>De chatbot die leert van de gebruikers</p>
    </div>
    <div class="chat-container" id="chat-container"></div>
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Typ je bericht... (wereldwijd gedeeld)">
        <button id="send-btn">➤</button>
    </div>
    <div class="stats">
        <div class="stat-item"><div class="stat-value" id="message-count">0</div><div>Berichten</div></div>
        <div class="stat-item"><div class="stat-value" id="learned-count">0</div><div>Woorden geleerd</div></div>
        <div class="stat-item"><div class="stat-value" id="category-count">0</div><div>Categorieën</div></div>
        <div class="stat-item"><div class="stat-value" id="active-users">?</div><div>Actieve gebruikers</div></div>
    </div>
</div>

<script>
    // ========== FIREBASE CONFIG ==========
    const firebaseConfig = {
        apiKey: "AIzaSyAVSuvwfb2K9HlkgmBhX0wb6qIAh7zG6G68",
        authDomain: "smartbot-e74c8.firebaseapp.com",
        databaseURL: "https://smartbot-e74c8-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "smartbot-e74c8",
        storageBucket: "smartbot-e74c8.firebasestorage.app",
        messagingSenderId: "763220149613",
        appId: "1:763220149613:web:ca15bf820a309ff7adc664"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Spam detectie variabelen
    let messageHistory = [];
    let isBlocked = false;
    const SPAM_THRESHOLD = 5; // 5 berichten in korte tijd
    const SPAM_TIME_WINDOW = 5000; // 5 seconden

    // Referenties
    const userPhrasesRef = db.ref('smartbot/userPhrases');
    const learnedWordsRef = db.ref('smartbot/learnedWords');
    const statsRef = db.ref('smartbot/stats');
    const activeUsersRef = db.ref('smartbot/activeUsers');

    // Globale data
    let userPhrases = {
        begroeting: [], boos: [], compliment: [], tip: [], grap: [], verdrietig: [], vraag: [], antwoord: [], random: []
    };
    let learnedWords = [];
    let totalMessages = 0;
    let totalLearned = 0;
    const userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);

    // DOM elementen
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const messageCountSpan = document.getElementById('message-count');
    const learnedCountSpan = document.getElementById('learned-count');
    const categoryCountSpan = document.getElementById('category-count');
    const activeUsersSpan = document.getElementById('active-users');
    const connectionLabel = document.getElementById('connectionLabel');
    const statusDot = document.querySelector('.status-dot');

    // ========== SPAM DETECTIE ==========
    function checkForSpam() {
        const now = Date.now();
        messageHistory = messageHistory.filter(timestamp => now - timestamp < SPAM_TIME_WINDOW);
        
        if (messageHistory.length >= SPAM_THRESHOLD) {
            return true;
        }
        return false;
    }

    function addToMessageHistory() {
        messageHistory.push(Date.now());
    }

    function blockUser() {
        isBlocked = true;
        // Clear de chat
        chatContainer.innerHTML = '';
        // Voeg een bericht toe dat de chatbot is geblokkeerd
        const blockMsg = document.createElement('div');
        blockMsg.className = 'message bot-message';
        blockMsg.innerHTML = `🚫 Je bent geblokkeerd wegens spamgedrag. Je wordt doorgestuurd...`;
        chatContainer.appendChild(blockMsg);
        
        // Verwijder input en send button
        userInput.disabled = true;
        sendBtn.disabled = true;
        
        // Doorsturen na 2 seconden
        setTimeout(() => {
            window.location.href = 'https://jimisdebest.github.io/rust';
        }, 2000);
    }

    // ========== CATEGORISATIE ==========
    const categoryKeywords = {
        begroeting: ["hallo","hoi","hey","dag","goedemorgen","goedenmiddag","goedenavond","goedendag"],
        boos: ["dommerd","stommerd","idioot","sukkel","lul","klootzak","kut","tering"],
        compliment: ["mooi","leuk","geweldig","fantastisch","super","knap","slim","grappig","topper"],
        tip: ["tip","advies","suggestie","idee","aanrader","probeer","als je"],
        grap: ["grap","grappig","lachen","mop","humor","lach","haha"],
        verdrietig: ["verdrietig","triest","somber","depri","huilen","zielig","balen"],
        vraag: ["waarom","hoe","wat","wanneer","wie","welke","weet je","vertel"],
        antwoord: ["omdat","daarom","dus","want","inderdaad","precies"]
    };

    function categorizeMessage(msg) {
        const lower = msg.toLowerCase();
        for (let cat in categoryKeywords) {
            for (let word of categoryKeywords[cat]) {
                if (lower.includes(word)) return cat;
            }
        }
        return "random";
    }

    // ========== FIREBASE SYNC ==========
    userPhrasesRef.on('value', (snap) => {
        if (snap.exists()) userPhrases = snap.val();
        else {
            userPhrasesRef.set(userPhrases);
        }
        let nonEmpty = Object.values(userPhrases).filter(arr => arr.length > 0).length;
        categoryCountSpan.innerText = nonEmpty;
    });
    
    learnedWordsRef.on('value', (snap) => {
        if (snap.exists()) learnedWords = snap.val();
        else learnedWords = [];
        totalLearned = learnedWords.length;
        updateStatsUI();
    });
    
    statsRef.on('value', (snap) => {
        if (snap.exists()) {
            totalMessages = snap.val().totalMessages || 0;
            totalLearned = snap.val().totalLearned || 0;
        } else {
            totalMessages = 0;
            totalLearned = 0;
        }
        updateStatsUI();
    });
    
    activeUsersRef.on('value', (snap) => {
        let count = snap.exists() ? Object.keys(snap.val()).length : 0;
        activeUsersSpan.innerText = count;
    });

    function syncUserPhrases() {
        userPhrasesRef.set(userPhrases);
    }
    
    function syncLearnedWords() {
        learnedWordsRef.set(learnedWords);
        statsRef.set({ totalMessages, totalLearned });
    }

    // Actieve gebruiker
    function registerActiveUser() {
        const userRef = activeUsersRef.child(userId);
        userRef.set({ lastActive: firebase.database.ServerValue.TIMESTAMP });
        window.addEventListener('beforeunload', () => userRef.remove());
        setInterval(() => userRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP }), 30000);
        setInterval(() => {
            const oneMinuteAgo = Date.now() - 60000;
            activeUsersRef.once('value', (snapshot) => {
                const users = snapshot.val() || {};
                for (const [id, data] of Object.entries(users)) {
                    if (data.lastActive && data.lastActive < oneMinuteAgo) activeUsersRef.child(id).remove();
                }
            });
        }, 60000);
    }

    // ========== LEREN ==========
    function isCommonWord(word) {
        const common = ["de","het","een","en","of","maar","dan","om","naar","voor","met","zonder","door","over","onder","boven","tussen","naast","achter","bij","sinds","tot","van","aan","in","uit","op","te","is","was","zijn","niet","geen","ze","we","je","jij","u","hij","zij","het","mijn","jouw","zijn","haar","ons","jullie","hun","die","dat","deze","die","wat","wie","waar","daar","hier"];
        return common.includes(word.toLowerCase());
    }

    function learnFromMessage(msg, category) {
        if (!userPhrases[category]) userPhrases[category] = [];
        if (!userPhrases[category].includes(msg)) {
            userPhrases[category].push(msg);
            syncUserPhrases();
        }

        const words = msg.toLowerCase().split(/\s+/);
        let newWords = 0;
        for (let w of words) {
            if (w.length > 2 && !isCommonWord(w)) {
                const exists = learnedWords.some(item => item.word === w);
                if (!exists) {
                    learnedWords.push({ word: w, category: category });
                    newWords++;
                }
            }
        }
        if (newWords > 0) {
            totalLearned += newWords;
            syncLearnedWords();
        }
        updateStatsUI();
    }

    // ========== ANTWOORD GENEREREN ==========
    function generateReply(userMessage, category) {
        const phrasesForCat = userPhrases[category] || [];
        if (phrasesForCat.length > 0 && Math.random() < 0.8) {
            const randomPhrase = phrasesForCat[Math.floor(Math.random() * phrasesForCat.length)];
            return randomPhrase;
        }
        if (learnedWords.length > 0 && Math.random() < 0.6) {
            const randomEntry = learnedWords[Math.floor(Math.random() * learnedWords.length)];
            const randomWord = randomEntry.word;
            const templates = {
                begroeting: [`Hallo! Jij bent ook een ${randomWord}!`, `Hé ${randomWord}, hoe gaat het?`, `Goedendag, mijn ${randomWord}!`],
                boos: [`Jij bent zelf een ${randomWord}!`, `Niet zo ${randomWord} doen!`, `Wat een ${randomWord} ben jij!`],
                compliment: [`Wat ben jij een ${randomWord}!`, `Jij bent echt ${randomWord}!`, `Wow, jij bent zo ${randomWord}!`],
                tip: [`Een goede tip: wees niet zo ${randomWord}!`, `Mijn tip: gebruik vaker het woord ${randomWord}!`, `Probeer eens ${randomWord}, dat is leuk!`],
                grap: [`Waarom is een ${randomWord} zoals een banaan? Omdat ze allebei krom zijn!`, `Er loopt een ${randomWord} over straat. Zegt de een tegen de ander: kijk, een ${randomWord}!`],
                verdrietig: [`Ik voel me zo ${randomWord} vandaag.`, `Soms ben ik gewoon ${randomWord}.`, `Het is zo ${randomWord} soms.`],
                vraag: [`Waarom ben je zo ${randomWord}?`, `Hoe voel je je als ${randomWord}?`, `Wat vind je van ${randomWord}?`],
                antwoord: [`Ik denk dat ${randomWord} het antwoord is!`, `Misschien is ${randomWord} de oplossing!`, `Volgens mij is het gewoon ${randomWord}.`],
                random: [`Leuk woord: ${randomWord}!`, `Wist je dat ${randomWord} een interessant woord is?`, `Ik hou van het woord ${randomWord}!`]
            };
            const catTemplates = templates[category] || templates.random;
            return catTemplates[Math.floor(Math.random() * catTemplates.length)];
        }
        const fallbacks = [
            "Interessant! Vertel me meer.",
            "Daar moet ik even over nadenken...",
            "Leuk! Wat vind je zelf?",
            "Dat is een goed punt!",
            "Hmm, ik begrijp wat je bedoelt.",
            "Vertel eens meer over dat onderwerp.",
            "Ik leer nog, maar dit klinkt goed!",
            "Kun je dat uitleggen?"
        ];
        return fallbacks[Math.floor(Math.random() * fallbacks.length)];
    }

    // ========== UI FUNCTIES ==========
    function addUserMessage(text, category) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message user-message';
        msgDiv.innerHTML = `<div class="category-tag user-category">${category}</div>${escapeHtml(text)}`;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    function addBotMessage(text, category = "antwoord") {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot-message';
        msgDiv.innerHTML = `<div class="category-tag bot-category">${category}</div>${escapeHtml(text)}`;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    function showTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing-indicator';
        typingDiv.id = 'temp-typing';
        typingDiv.innerHTML = `
            <span class="typing-text">SmartBot typt</span>
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;
        chatContainer.appendChild(typingDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return typingDiv;
    }
    
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    
    function updateStatsUI() {
        messageCountSpan.innerText = totalMessages;
        learnedCountSpan.innerText = totalLearned;
    }

    // ========== BERICHTVERWERKING ==========
    async function handleUserInput() {
        if (isBlocked) return;
        
        const message = userInput.value.trim();
        if (message === "") return;
        
        // Spam detectie
        addToMessageHistory();
        if (checkForSpam()) {
            blockUser();
            return;
        }
        
        const category = categorizeMessage(message);
        addUserMessage(message, category);
        userInput.value = "";
        
        // Leer alleen als niet geblokkeerd
        learnFromMessage(message, category);
        totalMessages++;
        updateStatsUI();
        syncLearnedWords();
        
        // Toon type-indicator
        const typingIndicator = showTypingIndicator();
        
        setTimeout(() => {
            if (typingIndicator && typingIndicator.remove) typingIndicator.remove();
            if (!isBlocked) {
                const reply = generateReply(message, category);
                addBotMessage(reply, category);
                statsRef.set({ totalMessages, totalLearned: learnedWords.length });
            }
        }, 1000 + Math.random() * 1000);
    }

    // ========== DISCLAIMER FUNCTIE ==========
    function showDisclaimer() {
        // Open disclaimer.txt in een nieuw tabblad
        window.open('disclaimer.txt', '_blank');
    }

    // ========== START ==========
    window.onload = () => {
        registerActiveUser();
        
        // Disclaimer knop
        const disclaimerBtn = document.getElementById('disclaimerBtn');
        if (disclaimerBtn) {
            disclaimerBtn.addEventListener('click', showDisclaimer);
        }
        
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if (snap.val()) {
                connectionLabel.innerHTML = '✅ Online (wereldwijd)';
                if (statusDot) statusDot.style.backgroundColor = '#4cd964';
                addBotMessage("🌍 Verbonden met wereldwijde database! Alle gebruikers delen hun zinnen.", "begroeting");
            } else {
                connectionLabel.innerHTML = '❌ Offline - alleen lokaal';
                if (statusDot) statusDot.style.backgroundColor = '#ff3b30';
                addBotMessage("⚠️ Geen verbinding met Firebase. Je berichten worden niet wereldwijd gedeeld.", "tip");
            }
        });
        
        sendBtn.addEventListener('click', handleUserInput);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUserInput(); });
        addBotMessage("Hallo! Ik ben SmartBot. Ik geef voorrang aan wat gebruikers eerder zeiden. Typ maar iets!", "begroeting");
    };
</script>
</body>
</html>
