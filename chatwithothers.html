<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerChat - Chat met Gebruikersnamen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        /* Licht thema (standaard) */
        :root {
            --bg-gradient-start: #6e8efb;
            --bg-gradient-end: #a777e3;
            --container-bg: rgba(255,255,255,0.95);
            --chat-bg: #f5f7ff;
            --user-msg-start: #4a6cf7;
            --user-msg-end: #7a52d4;
            --other-msg-bg: white;
            --other-msg-border: #ddd;
            --text-color: #333;
            --input-bg: white;
            --input-border: #ddd;
            --sidebar-bg: #f0f5ff;
            --online-badge: #4cd964;
            --offline-badge: #ff3b30;
        }
        
        /* Donker thema */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient-start: #1a1a2e;
                --bg-gradient-end: #16213e;
                --container-bg: rgba(30,30,46,0.95);
                --chat-bg: #1e1e2e;
                --user-msg-start: #4a6cf7;
                --user-msg-end: #7a52d4;
                --other-msg-bg: #2d2d3f;
                --other-msg-border: #404055;
                --text-color: #e0e0e0;
                --input-bg: #2d2d3f;
                --input-border: #404055;
                --sidebar-bg: #252538;
                --online-badge: #4cd964;
                --offline-badge: #ff3b30;
            }
        }
        
        body { 
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end)); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 0; 
            margin: 0; 
        }
        
        .container { 
            width: 100%; 
            max-width: 1400px; 
            height: 100vh;
            max-height: 100vh;
            background: var(--container-bg); 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }
        
        .header { 
            background: linear-gradient(90deg, #4a6cf7, #7a52d4); 
            color: white; 
            padding: 15px 20px;
            text-align: center; 
            position: relative; 
        }
        
        .header-buttons {
            position: absolute;
            top: 10px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        
        .disclaimer-btn {
            background: rgba(0,0,0,0.4);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .disclaimer-btn:hover {
            background: rgba(0,0,0,0.6);
        }
        
        .online-status { 
            position: absolute; 
            top: 10px; 
            right: 20px; 
            background: rgba(0,0,0,0.4); 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        
        .status-dot { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            background: var(--online-badge); 
            animation: pulse 1.5s infinite; 
        }
        
        @keyframes pulse { 
            0% { opacity: 0.4; transform: scale(0.8); } 
            100% { opacity: 1; transform: scale(1.2); } 
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--input-border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .user-info {
            padding: 15px;
            border-bottom: 1px solid var(--input-border);
        }
        
        .username-input {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .username-input input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--text-color);
        }
        
        .username-input button {
            padding: 8px 12px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .current-username {
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
            padding: 8px;
            background: var(--input-bg);
            border-radius: 8px;
            word-break: break-all;
        }
        
        .online-users {
            flex: 1;
            padding: 15px;
        }
        
        .online-users h3 {
            margin-bottom: 10px;
            font-size: 1rem;
            color: var(--text-color);
        }
        
        .user-list {
            list-style: none;
        }
        
        .user-list li {
            padding: 10px;
            margin-bottom: 5px;
            background: var(--input-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-color);
        }
        
        .user-list li:hover {
            background: var(--user-msg-start);
            color: white;
        }
        
        .user-list li.active {
            background: var(--user-msg-start);
            color: white;
        }
        
        .connect-input {
            padding: 15px;
            border-top: 1px solid var(--input-border);
        }
        
        .connect-input input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--text-color);
            margin-bottom: 5px;
        }
        
        .connect-input button {
            width: 100%;
            padding: 8px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 15px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--input-border);
            color: var(--text-color);
        }
        
        .chat-header h3 {
            font-size: 1rem;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--chat-bg);
        }
        
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            position: relative;
            color: var(--text-color);
        }
        
        .message-user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--user-msg-start), var(--user-msg-end));
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message-other {
            align-self: flex-start;
            background: var(--other-msg-bg);
            border: 1px solid var(--other-msg-border);
            border-bottom-left-radius: 5px;
        }
        
        .message-info {
            font-size: 0.7rem;
            margin-bottom: 5px;
            opacity: 0.7;
        }
        
        .input-container { 
            display: flex; 
            padding: 15px; 
            background: var(--input-bg); 
            border-top: 1px solid var(--input-border); 
        }
        
        #message-input { 
            flex: 1; 
            padding: 12px 15px; 
            border: 1px solid var(--input-border); 
            border-radius: 25px; 
            outline: none; 
            background: var(--input-bg);
            color: var(--text-color);
        }
        
        #send-btn { 
            background: linear-gradient(135deg, #4a6cf7, #7a52d4); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            margin-left: 10px; 
            cursor: pointer; 
        }
        
        .typing-indicator {
            align-self: flex-start;
            background: var(--other-msg-bg);
            padding: 8px 15px;
            border-radius: 18px;
            font-style: italic;
            font-size: 0.85rem;
            color: var(--text-color);
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-buttons">
            <button class="disclaimer-btn" id="disclaimerBtn">⚠️ Disclaimer</button>
        </div>
        <div class="online-status">
            <div class="status-dot"></div>
            <span id="connectionLabel">Verbonden</span>
        </div>
        <h1>PeerChat</h1>
        <p>Chat met andere gebruikers via gebruikersnaam</p>
    </div>
    
    <div class="main-content">
        <div class="sidebar">
            <div class="user-info">
                <strong>👤 Jouw gebruikersnaam:</strong>
                <div class="username-input">
                    <input type="text" id="usernameInput" placeholder="Kies een gebruikersnaam" maxlength="20">
                    <button onclick="setUsername()">Set</button>
                </div>
                <div class="current-username" id="currentUsernameDisplay">Nog niet ingesteld</div>
            </div>
            
            <div class="online-users">
                <h3>📡 Online gebruikers</h3>
                <ul class="user-list" id="userList">
                    <li>Geen gebruikers online...</li>
                </ul>
            </div>
            
            <div class="connect-input">
                <input type="text" id="usernameConnectInput" placeholder="Voer gebruikersnaam in om te chatten">
                <button onclick="connectToUsername()">🔗 Verbinden</button>
            </div>
        </div>
        
        <div class="chat-area">
            <div class="chat-header">
                <h3 id="chatWithLabel">Niet verbonden</h3>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message message-other">
                    <div class="message-info">🤖 Systeem</div>
                    Stel eerst je gebruikersnaam in en verbind met iemand!
                </div>
            </div>
            <div class="input-container">
                <input type="text" id="message-input" placeholder="Typ je bericht..." disabled>
                <button id="send-btn" disabled>➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    let peer = null;
    let currentConnection = null;
    let currentPeerId = null;
    let currentPeerUsername = null;
    let myId = null;
    let myUsername = null;
    let typingTimeout = null;
    let isTyping = false;
    
    // Gebruikers database (username -> peerId)
    let userDatabase = {};
    
    // DOM elementen
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const userList = document.getElementById('userList');
    const currentUsernameDisplay = document.getElementById('currentUsernameDisplay');
    const chatWithLabel = document.getElementById('chatWithLabel');
    
    // ========== PEER.JS INITIALISATIE ==========
    function initPeer() {
        peer = new Peer();
        
        peer.on('open', (id) => {
            myId = id;
            console.log('Peer ID:', myId);
            addSystemMessage(`✅ Verbonden met PeerChat netwerk!`);
            
            // Als er al een gebruikersnaam was ingesteld, registreer die opnieuw
            if (myUsername) {
                registerUsername();
            }
        });
        
        peer.on('connection', (conn) => {
            addSystemMessage(`📞 Nieuwe verbindingsaanvraag...`);
            
            conn.on('data', (data) => {
                handleIncomingData(data, conn);
            });
            
            conn.on('open', () => {
                // Vraag de gebruikersnaam van de ander op
                conn.send({ type: 'request_username' });
            });
            
            conn.on('close', () => {
                if (currentConnection === conn) {
                    addSystemMessage(`🔌 Verbinding verbroken met ${currentPeerUsername || 'onbekende gebruiker'}`);
                    currentConnection = null;
                    currentPeerId = null;
                    currentPeerUsername = null;
                    chatWithLabel.textContent = 'Niet verbonden';
                    messageInput.disabled = true;
                    sendBtn.disabled = true;
                }
            });
        });
        
        peer.on('error', (err) => {
            console.error('Peer error:', err);
            addSystemMessage(`❌ Fout: ${err.type}`);
        });
        
        peer.on('disconnected', () => {
            addSystemMessage(`⚠️ Verbinding verbroken, opnieuw verbinden...`);
            setTimeout(() => {
                if (peer && peer.disconnected) {
                    peer.reconnect();
                }
            }, 3000);
        });
    }
    
    // ========== GEBRUIKERSNAAM REGISTRATIE ==========
    function setUsername() {
        const username = document.getElementById('usernameInput').value.trim();
        if (!username) {
            addSystemMessage('❌ Voer een geldige gebruikersnaam in!');
            return;
        }
        
        if (username.length > 20) {
            addSystemMessage('❌ Gebruikersnaam mag maximaal 20 tekens zijn!');
            return;
        }
        
        myUsername = username;
        currentUsernameDisplay.textContent = myUsername;
        document.getElementById('usernameInput').value = '';
        
        addSystemMessage(`✅ Je gebruikersnaam is nu: ${myUsername}`);
        
        if (myId) {
            registerUsername();
        }
    }
    
    function registerUsername() {
        // Registreer bij localStorage
        const users = JSON.parse(localStorage.getItem('peerchat_usernames') || '{}');
        users[myUsername] = {
            peerId: myId,
            lastSeen: Date.now()
        };
        localStorage.setItem('peerchat_usernames', JSON.stringify(users));
        
        addSystemMessage(`📡 Gebruikersnaam "${myUsername}" geregistreerd!`);
        
        // Start discovery
        startDiscovery();
    }
    
    // ========== DISCOVERY SERVICE ==========
    function startDiscovery() {
        function updateUserList() {
            const users = JSON.parse(localStorage.getItem('peerchat_usernames') || '{}');
            const now = Date.now();
            const activeUsers = [];
            
            for (const [username, data] of Object.entries(users)) {
                if (now - data.lastSeen < 30000 && username !== myUsername) {
                    activeUsers.push({ username, peerId: data.peerId });
                }
            }
            
            // Update UI
            if (activeUsers.length === 0) {
                userList.innerHTML = '<li>👤 Geen andere actieve gebruikers</li>';
            } else {
                userList.innerHTML = activeUsers.map(user => `
                    <li onclick="connectToUsername('${user.username}')">
                        <span>👤 ${escapeHtml(user.username)}</span>
                        <span style="font-size:0.7rem;">online</span>
                    </li>
                `).join('');
            }
        }
        
        // Registreer/update deze gebruiker regelmatig
        function updateRegistration() {
            if (myUsername && myId) {
                const users = JSON.parse(localStorage.getItem('peerchat_usernames') || '{}');
                users[myUsername] = {
                    peerId: myId,
                    lastSeen: Date.now()
                };
                localStorage.setItem('peerchat_usernames', JSON.stringify(users));
                updateUserList();
            }
        }
        
        // Cleanup oude gebruikers
        function cleanupUsers() {
            const users = JSON.parse(localStorage.getItem('peerchat_usernames') || '{}');
            const now = Date.now();
            let changed = false;
            
            for (const [username, data] of Object.entries(users)) {
                if (now - data.lastSeen > 30000) {
                    delete users[username];
                    changed = true;
                }
            }
            
            if (changed) {
                localStorage.setItem('peerchat_usernames', JSON.stringify(users));
            }
            updateUserList();
        }
        
        updateRegistration();
        setInterval(updateRegistration, 10000);
        setInterval(cleanupUsers, 15000);
        
        window.addEventListener('storage', (e) => {
            if (e.key === 'peerchat_usernames') {
                updateUserList();
            }
        });
        
        updateUserList();
    }
    
    // ========== VERBINDING MAKEN ==========
    function connectToUsername(username) {
        if (!username) {
            username = document.getElementById('usernameConnectInput').value.trim();
            if (!username) {
                addSystemMessage('❌ Voer een gebruikersnaam in!');
                return;
            }
        }
        
        if (username === myUsername) {
            addSystemMessage('❌ Je kunt niet met jezelf chatten!');
            return;
        }
        
        // Zoek peerId op basis van gebruikersnaam
        const users = JSON.parse(localStorage.getItem('peerchat_usernames') || '{}');
        const userData = users[username];
        
        if (!userData) {
            addSystemMessage(`❌ Gebruiker "${username}" is niet online!`);
            return;
        }
        
        const peerId = userData.peerId;
        
        if (currentConnection && !currentConnection.closed) {
            currentConnection.close();
        }
        
        addSystemMessage(`📞 Verbinden met "${username}"...`);
        
        const conn = peer.connect(peerId);
        currentConnection = conn;
        currentPeerId = peerId;
        currentPeerUsername = username;
        
        conn.on('open', () => {
            chatWithLabel.textContent = `Chatten met: ${username}`;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            addSystemMessage(`✅ Verbonden met ${username}!`);
            
            // Stuur eigen gebruikersnaam
            conn.send({ type: 'username', username: myUsername });
        });
        
        conn.on('data', (data) => {
            handleIncomingData(data, conn);
        });
        
        conn.on('close', () => {
            if (currentConnection === conn) {
                addSystemMessage(`🔌 Verbinding verbroken met ${currentPeerUsername || username}`);
                currentConnection = null;
                currentPeerId = null;
                currentPeerUsername = null;
                chatWithLabel.textContent = 'Niet verbonden';
                messageInput.disabled = true;
                sendBtn.disabled = true;
            }
        });
        
        document.getElementById('usernameConnectInput').value = '';
    }
    
    // ========== BERICHTEN AFHANDELEN ==========
    function handleIncomingData(data, conn) {
        if (data.type === 'message') {
            addMessage(data.text, false, data.sender);
        } else if (data.type === 'typing') {
            showTypingIndicator();
        } else if (data.type === 'username') {
            if (conn === currentConnection) {
                currentPeerUsername = data.username;
                chatWithLabel.textContent = `Chatten met: ${data.username}`;
            }
        } else if (data.type === 'request_username') {
            if (myUsername) {
                conn.send({ type: 'username', username: myUsername });
            }
        }
    }
    
    function sendMessage(text) {
        if (!currentConnection || currentConnection.closed) {
            addSystemMessage('❌ Geen actieve verbinding!');
            return;
        }
        
        currentConnection.send({
            type: 'message',
            text: text,
            sender: myUsername
        });
        
        addMessage(text, true, myUsername);
    }
    
    function sendTyping() {
        if (!currentConnection || currentConnection.closed) return;
        
        if (!isTyping) {
            isTyping = true;
            currentConnection.send({
                type: 'typing'
            });
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTyping = false;
            }, 2000);
        }
    }
    
    // ========== UI FUNCTIES ==========
    function addMessage(text, isUser, senderName) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'message-user' : 'message-other'}`;
        
        const infoSpan = document.createElement('div');
        infoSpan.className = 'message-info';
        infoSpan.textContent = isUser ? myUsername || 'Jij' : senderName || currentPeerUsername || 'Onbekend';
        
        const textSpan = document.createElement('div');
        textSpan.textContent = text;
        
        messageDiv.appendChild(infoSpan);
        messageDiv.appendChild(textSpan);
        
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function addSystemMessage(text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message message-other';
        messageDiv.style.opacity = '0.7';
        messageDiv.style.fontStyle = 'italic';
        
        const infoSpan = document.createElement('div');
        infoSpan.className = 'message-info';
        infoSpan.textContent = '🤖 Systeem';
        
        const textSpan = document.createElement('div');
        textSpan.textContent = text;
        
        messageDiv.appendChild(infoSpan);
        messageDiv.appendChild(textSpan);
        
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    
    let typingIndicatorDiv = null;
    
    function showTypingIndicator() {
        if (typingIndicatorDiv) {
            typingIndicatorDiv.remove();
        }
        
        typingIndicatorDiv = document.createElement('div');
        typingIndicatorDiv.className = 'typing-indicator';
        typingIndicatorDiv.textContent = `👤 ${currentPeerUsername || 'Gebruiker'} typt...`;
        chatMessages.appendChild(typingIndicatorDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        setTimeout(() => {
            if (typingIndicatorDiv) {
                typingIndicatorDiv.remove();
                typingIndicatorDiv = null;
            }
        }, 2000);
    }
    
    // ========== TYPING DETECTIE ==========
    function onMessageTyping() {
        if (currentConnection && !currentConnection.closed) {
            sendTyping();
        }
    }
    
    // ========== DISCLAIMER ==========
    function showDisclaimer() {
        window.open('disclaimer.txt', '_blank');
    }
    
    // ========== INITIALISATIE ==========
    function init() {
        initPeer();
        
        messageInput.addEventListener('input', onMessageTyping);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && messageInput.value.trim() && currentConnection && !currentConnection.closed) {
                sendMessage(messageInput.value.trim());
                messageInput.value = '';
            }
        });
        
        sendBtn.addEventListener('click', () => {
            if (messageInput.value.trim() && currentConnection && !currentConnection.closed) {
                sendMessage(messageInput.value.trim());
                messageInput.value = '';
            }
        });
        
        document.getElementById('disclaimerBtn').addEventListener('click', showDisclaimer);
        
        // Enter in username field
        document.getElementById('usernameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') setUsername();
        });
        
        document.getElementById('usernameConnectInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') connectToUsername();
        });
    }
    
    // Start alles
    init();
</script>
</body>
</html>
