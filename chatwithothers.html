<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalChat - Chat met Iedereen Wereldwijd</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        /* Licht thema (standaard) */
        :root {
            --bg-gradient-start: #6e8efb;
            --bg-gradient-end: #a777e3;
            --container-bg: rgba(255,255,255,0.95);
            --chat-bg: #f5f7ff;
            --user-msg-start: #4a6cf7;
            --user-msg-end: #7a52d4;
            --other-msg-bg: white;
            --other-msg-border: #ddd;
            --text-color: #333;
            --input-bg: white;
            --input-border: #ddd;
            --sidebar-bg: #f0f5ff;
            --online-badge: #4cd964;
            --system-color: #888;
            --overlay-bg: rgba(0,0,0,0.5);
            --modal-bg: white;
        }
        
        /* Donker thema */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient-start: #1a1a2e;
                --bg-gradient-end: #16213e;
                --container-bg: rgba(30,30,46,0.95);
                --chat-bg: #1e1e2e;
                --user-msg-start: #4a6cf7;
                --user-msg-end: #7a52d4;
                --other-msg-bg: #2d2d3f;
                --other-msg-border: #404055;
                --text-color: #e0e0e0;
                --input-bg: #2d2d3f;
                --input-border: #404055;
                --sidebar-bg: #252538;
                --online-badge: #4cd964;
                --system-color: #aaa;
                --modal-bg: #2d2d3f;
            }
        }
        
        body { 
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end)); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 0; 
            margin: 0; 
        }
        
        .container { 
            width: 100%; 
            max-width: 1200px; 
            height: 100vh;
            max-height: 100vh;
            background: var(--container-bg); 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }
        
        .header { 
            background: linear-gradient(90deg, #4a6cf7, #7a52d4); 
            color: white; 
            padding: 15px 20px;
            text-align: center; 
            position: relative; 
        }
        
        .header-buttons {
            position: absolute;
            top: 10px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        
        .disclaimer-btn, .toggle-sidebar-btn {
            background: rgba(0,0,0,0.4);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .disclaimer-btn:hover, .toggle-sidebar-btn:hover {
            background: rgba(0,0,0,0.6);
        }
        
        .online-status { 
            position: absolute; 
            top: 10px; 
            right: 20px; 
            background: rgba(0,0,0,0.4); 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        
        .status-dot { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            background: var(--online-badge); 
            animation: pulse 1.5s infinite; 
        }
        
        @keyframes pulse { 
            0% { opacity: 0.4; transform: scale(0.8); } 
            100% { opacity: 1; transform: scale(1.2); } 
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--input-border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: width 0.3s ease, padding 0.3s ease;
        }
        
        .sidebar.collapsed {
            width: 0;
            padding: 0;
            overflow: hidden;
        }
        
        .user-info {
            padding: 15px;
            border-bottom: 1px solid var(--input-border);
        }
        
        .username-input {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .username-input input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--text-color);
        }
        
        .username-input button {
            padding: 8px 12px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .current-username {
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
            padding: 8px;
            background: var(--input-bg);
            border-radius: 8px;
            word-break: break-all;
        }
        
        .online-users {
            flex: 1;
            padding: 15px;
        }
        
        .online-users h3 {
            margin-bottom: 10px;
            font-size: 1rem;
            color: var(--text-color);
        }
        
        .user-list {
            list-style: none;
        }
        
        .user-list li {
            padding: 8px;
            margin-bottom: 5px;
            background: var(--input-bg);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-color);
            font-size: 0.9rem;
        }
        
        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--online-badge);
            display: inline-block;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 15px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--input-border);
            color: var(--text-color);
        }
        
        .chat-header h3 {
            font-size: 1rem;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--chat-bg);
        }
        
        .message {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 18px;
            position: relative;
            color: var(--text-color);
            word-wrap: break-word;
            animation: slideIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        
        .message-user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--user-msg-start), var(--user-msg-end));
            color: white;
            border-bottom-right-radius: 5px;
            animation: slideInRight 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        
        .message-other {
            align-self: flex-start;
            background: var(--other-msg-bg);
            border: 1px solid var(--other-msg-border);
            border-bottom-left-radius: 5px;
        }
        
        .message-system {
            align-self: center;
            background: var(--system-color);
            color: white;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 20px;
            max-width: 90%;
            text-align: center;
            opacity: 0.7;
        }
        
        .message-info {
            font-size: 0.7rem;
            margin-bottom: 5px;
            opacity: 0.8;
        }
        
        .message-user .message-info {
            color: rgba(255,255,255,0.8);
        }
        
        .input-container { 
            display: flex; 
            padding: 15px; 
            background: var(--input-bg); 
            border-top: 1px solid var(--input-border); 
        }
        
        #message-input { 
            flex: 1; 
            padding: 12px 15px; 
            border: 1px solid var(--input-border); 
            border-radius: 25px; 
            outline: none; 
            background: var(--input-bg);
            color: var(--text-color);
            transition: border 0.3s;
        }
        
        #message-input:focus {
            border-color: #4a6cf7;
        }
        
        #send-btn { 
            background: linear-gradient(135deg, #4a6cf7, #7a52d4); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            margin-left: 10px; 
            cursor: pointer; 
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        
        #send-btn:hover {
            transform: scale(1.05);
        }
        
        #send-btn:active {
            transform: scale(0.95);
        }
        
        .typing-indicator {
            align-self: flex-start;
            background: var(--other-msg-bg);
            padding: 8px 15px;
            border-radius: 18px;
            font-style: italic;
            font-size: 0.8rem;
            color: var(--text-color);
            opacity: 0.8;
            animation: fadeIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .typing-dots {
            display: flex;
            gap: 3px;
        }
        
        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-color);
            animation: typingBounce 1.4s infinite;
        }
        
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
        
        /* Modal popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--modal-bg);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(-50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: var(--text-color);
        }
        
        .modal-content input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            margin-bottom: 15px;
            font-size: 1rem;
        }
        
        .modal-content button {
            padding: 10px 30px;
            background: linear-gradient(135deg, #4a6cf7, #7a52d4);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        
        .modal-content button:hover {
            transform: scale(1.05);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 220px;
            }
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-buttons">
            <button class="toggle-sidebar-btn" id="toggleSidebarBtn">☰ Zijmenu</button>
            <button class="disclaimer-btn" id="disclaimerBtn">⚠️ Disclaimer</button>
        </div>
        <div class="online-status">
            <div class="status-dot"></div>
            <span id="connectionLabel">Verbinden...</span>
        </div>
        <h1>🌍 GlobalChat</h1>
        <p>Chat met iedereen die online is</p>
    </div>
    
    <div class="main-content">
        <div class="sidebar" id="sidebar">
            <div class="user-info">
                <strong>👤 Jouw naam:</strong>
                <div class="username-input">
                    <input type="text" id="usernameInput" placeholder="Kies een gebruikersnaam" maxlength="20">
                    <button onclick="changeUsername()">Wijzig</button>
                </div>
                <div class="current-username" id="currentUsernameDisplay">Nog niet ingesteld</div>
            </div>
            
            <div class="online-users">
                <h3>📡 Online nu (<span id="onlineCount">0</span>)</h3>
                <ul class="user-list" id="userList">
                    <li>Laden...</li>
                </ul>
            </div>
        </div>
        
        <div class="chat-area">
            <div class="chat-header">
                <h3>💬 Wereldwijde chat</h3>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message message-system">
                    Welkom bij GlobalChat!
                </div>
            </div>
            <div class="input-container">
                <input type="text" id="message-input" placeholder="Typ je bericht..." disabled>
                <button id="send-btn" disabled>➤</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal popup voor naam -->
<div class="modal" id="nameModal">
    <div class="modal-content">
        <h2>👋 Welkom bij GlobalChat!</h2>
        <p style="margin-bottom: 15px; color: var(--text-color);">Kies een gebruikersnaam om te beginnen</p>
        <input type="text" id="modalUsernameInput" placeholder="Jouw gebruikersnaam" maxlength="20">
        <button onclick="setNameFromModal()">Start Chatten →</button>
    </div>
</div>

<script>
    // ========== FIREBASE CONFIG ==========
    const firebaseConfig = {
        apiKey: "AIzaSyAVSuvwfb2K9HlkgmBhX0wb6qIAh7zG6G68",
        authDomain: "smartbot-e74c8.firebaseapp.com",
        databaseURL: "https://smartbot-e74c8-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "smartbot-e74c8",
        storageBucket: "smartbot-e74c8.firebasestorage.app",
        messagingSenderId: "763220149613",
        appId: "1:763220149613:web:ca15bf820a309ff7adc664"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Referenties
    const messagesRef = db.ref('globalchat/messages');
    const usersRef = db.ref('globalchat/users');
    const typingRef = db.ref('globalchat/typing');
    
    // Variabelen
    let myUsername = null;
    let myUserId = null;
    let typingTimeout = null;
    let isTyping = false;
    let loadedMessages = new Set();
    let sidebarCollapsed = false;
    
    // DOM elementen
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const userList = document.getElementById('userList');
    const currentUsernameDisplay = document.getElementById('currentUsernameDisplay');
    const connectionLabel = document.getElementById('connectionLabel');
    const statusDot = document.querySelector('.status-dot');
    const onlineCountSpan = document.getElementById('onlineCount');
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const nameModal = document.getElementById('nameModal');
    
    // ========== LOCALSTORAGE FUNCTIES ==========
    function loadUsernameFromStorage() {
        const savedName = localStorage.getItem('globalchat_username');
        if (savedName) {
            myUsername = savedName;
            myUserId = localStorage.getItem('globalchat_userid');
            if (!myUserId) {
                myUserId = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                localStorage.setItem('globalchat_userid', myUserId);
            }
            currentUsernameDisplay.textContent = myUsername;
            enableChat();
            registerUser();
            setupTypingListener();
            return true;
        }
        return false;
    }
    
    function saveUsernameToStorage(username) {
        localStorage.setItem('globalchat_username', username);
        localStorage.setItem('globalchat_userid', myUserId);
    }
    
    // ========== MODAL FUNCTIES ==========
    function showModal() {
        nameModal.classList.add('active');
    }
    
    function hideModal() {
        nameModal.classList.remove('active');
    }
    
    function setNameFromModal() {
        const username = document.getElementById('modalUsernameInput').value.trim();
        if (!username) {
            alert('Voer een geldige gebruikersnaam in!');
            return;
        }
        if (username.length > 20) {
            alert('Gebruikersnaam mag maximaal 20 tekens zijn!');
            return;
        }
        
        myUsername = username;
        myUserId = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        saveUsernameToStorage(username);
        currentUsernameDisplay.textContent = myUsername;
        
        hideModal();
        enableChat();
        registerUser();
        setupTypingListener();
        addSystemMessage(`✅ Welkom ${myUsername}! Je bent nu online.`);
    }
    
    function changeUsername() {
        const newName = document.getElementById('usernameInput').value.trim();
        if (!newName) {
            addSystemMessage('❌ Voer een geldige gebruikersnaam in!');
            return;
        }
        if (newName.length > 20) {
            addSystemMessage('❌ Gebruikersnaam mag maximaal 20 tekens zijn!');
            return;
        }
        
        // Verwijder oude gebruiker
        if (myUserId) {
            usersRef.child(myUserId).remove();
            if (isTyping) typingRef.child(myUserId).remove();
        }
        
        myUsername = newName;
        myUserId = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        saveUsernameToStorage(newName);
        currentUsernameDisplay.textContent = myUsername;
        document.getElementById('usernameInput').value = '';
        
        registerUser();
        addSystemMessage(`✅ Gebruikersnaam gewijzigd naar ${myUsername}!`);
    }
    
    function enableChat() {
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.focus();
    }
    
    // ========== BERICHTEN OUDER DAN 2 DAGEN VERWIJDEREN ==========
    function cleanOldMessages() {
        const twoDaysAgo = Date.now() - (2 * 24 * 60 * 60 * 1000);
        
        messagesRef.once('value', (snapshot) => {
            const messages = snapshot.val() || {};
            let deletedCount = 0;
            
            for (const [key, message] of Object.entries(messages)) {
                if (message.timestamp && message.timestamp < twoDaysAgo) {
                    messagesRef.child(key).remove();
                    deletedCount++;
                }
            }
            
            if (deletedCount > 0) {
                console.log(`🗑️ ${deletedCount} oude berichten verwijderd`);
            }
        });
    }
    
    // ========== GEBRUIKER REGISTRATIE ==========
    function registerUser() {
        const userRef = usersRef.child(myUserId);
        userRef.set({
            username: myUsername,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
        
        window.addEventListener('beforeunload', () => {
            if (myUserId) {
                usersRef.child(myUserId).remove();
                if (isTyping) typingRef.child(myUserId).remove();
            }
        });
        
        setInterval(() => {
            if (myUserId && myUsername) {
                usersRef.child(myUserId).update({
                    username: myUsername,
                    lastSeen: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }, 15000);
    }
    
    // ========== BERICHTEN VERSTUREN ==========
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        if (!myUsername) return;
        
        const message = {
            text: text,
            username: myUsername,
            timestamp: Date.now(),
            userId: myUserId,
            messageId: Date.now() + '_' + Math.random().toString(36).substr(2, 6)
        };
        
        messagesRef.push(message);
        messageInput.value = '';
        stopTyping();
        
        // Voeg eigen bericht direct toe voor snellere feedback
        addMessage(text, true, myUsername, null);
    }
    
    // ========== BERICHTEN ONTVANGEN ==========
    function setupMessageListener() {
        messagesRef.limitToLast(100).on('child_added', (snapshot) => {
            const message = snapshot.val();
            const messageKey = snapshot.key;
            
            if (loadedMessages.has(messageKey)) return;
            loadedMessages.add(messageKey);
            
            // Alleen toevoegen als het niet van onszelf is (eigen bericht is al toegevoegd)
            if (message.userId !== myUserId) {
                addMessage(message.text, false, message.username, message.timestamp);
            }
        });
    }
    
    // ========== ONLINE GEBRUIKERS ==========
    function setupUserListener() {
        usersRef.on('value', (snapshot) => {
            const users = snapshot.val() || {};
            const now = Date.now();
            const onlineUsers = [];
            
            for (const [id, data] of Object.entries(users)) {
                const lastSeen = data.lastSeen;
                const isOnline = lastSeen && (now - lastSeen < 30000);
                
                if (isOnline && id !== myUserId) {
                    onlineUsers.push(data.username);
                }
            }
            
            onlineCountSpan.textContent = onlineUsers.length;
            
            if (onlineUsers.length === 0) {
                userList.innerHTML = '<li>👤 Geen andere gebruikers online</li>';
            } else {
                userList.innerHTML = onlineUsers.map(username => `
                    <li>
                        <span><span class="online-dot"></span>${escapeHtml(username)}</span>
                        <span style="font-size:0.7rem;">online</span>
                    </li>
                `).join('');
            }
        });
        
        setInterval(() => {
            const cutoff = Date.now() - 30000;
            usersRef.once('value', (snapshot) => {
                const users = snapshot.val() || {};
                for (const [id, data] of Object.entries(users)) {
                    if (data.lastSeen && data.lastSeen < cutoff) {
                        usersRef.child(id).remove();
                    }
                }
            });
        }, 10000);
    }
    
    // ========== TYPING INDICATOR ==========
    function setupTypingListener() {
        typingRef.on('value', (snapshot) => {
            const typingData = snapshot.val() || {};
            let typingUsers = [];
            
            for (const [id, data] of Object.entries(typingData)) {
                if (id !== myUserId && data.isTyping && (Date.now() - data.timestamp < 3000)) {
                    typingUsers.push(data.username);
                }
            }
            
            const oldIndicator = document.getElementById('global-typing-indicator');
            if (oldIndicator) oldIndicator.remove();
            
            if (typingUsers.length > 0) {
                const typingDiv = document.createElement('div');
                typingDiv.id = 'global-typing-indicator';
                typingDiv.className = 'typing-indicator';
                
                let typingText = '';
                if (typingUsers.length === 1) {
                    typingText = `${escapeHtml(typingUsers[0])} is aan het typen`;
                } else if (typingUsers.length === 2) {
                    typingText = `${escapeHtml(typingUsers[0])} en ${escapeHtml(typingUsers[1])} zijn aan het typen`;
                } else {
                    typingText = `Meerdere mensen zijn aan het typen`;
                }
                
                typingDiv.innerHTML = `
                    <span>✏️ ${typingText}</span>
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                `;
                
                chatMessages.appendChild(typingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        });
    }
    
    function startTyping() {
        if (!myUserId || !myUsername) return;
        
        if (!isTyping) {
            isTyping = true;
            typingRef.child(myUserId).set({
                username: myUsername,
                isTyping: true,
                timestamp: Date.now()
            });
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                stopTyping();
            }, 2000);
        }
    }
    
    function stopTyping() {
        if (myUserId && isTyping) {
            typingRef.child(myUserId).remove();
            isTyping = false;
        }
    }
    
    // ========== UI FUNCTIES ==========
    function addMessage(text, isOwnMessage, username, timestamp) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isOwnMessage ? 'message-user' : 'message-other'}`;
        
        const infoSpan = document.createElement('div');
        infoSpan.className = 'message-info';
        infoSpan.textContent = isOwnMessage ? `${username} (jij)` : username;
        
        const textSpan = document.createElement('div');
        textSpan.textContent = text;
        
        messageDiv.appendChild(infoSpan);
        messageDiv.appendChild(textSpan);
        
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function addSystemMessage(text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message message-system';
        messageDiv.textContent = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        setTimeout(() => {
            if (messageDiv.remove) messageDiv.remove();
        }, 5000);
    }
    
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    
    // ========== SIDEBAR INKLAPPEN ==========
    function toggleSidebar() {
        sidebarCollapsed = !sidebarCollapsed;
        if (sidebarCollapsed) {
            sidebar.classList.add('collapsed');
            toggleSidebarBtn.textContent = '☰ Menu';
        } else {
            sidebar.classList.remove('collapsed');
            toggleSidebarBtn.textContent = '☰ Zijmenu';
        }
    }
    
    // ========== VERBINDINGSSTATUS ==========
    function setupConnectionStatus() {
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if (snap.val()) {
                connectionLabel.innerHTML = '✅ Online';
                if (statusDot) statusDot.style.backgroundColor = '#4cd964';
                if (myUsername) {
                    addSystemMessage('🌍 Verbonden met wereldwijde chat!');
                    registerUser();
                }
            } else {
                connectionLabel.innerHTML = '❌ Offline';
                if (statusDot) statusDot.style.backgroundColor = '#ff3b30';
                addSystemMessage('⚠️ Geen verbinding. Berichten worden niet verzonden.');
            }
        });
    }
    
    // ========== DISCLAIMER ==========
    function showDisclaimer() {
        window.open('disclaimer.txt', '_blank');
    }
    
    // ========== INITIALISATIE ==========
    function init() {
        setupConnectionStatus();
        setupUserListener();
        setupMessageListener();
        
        // Oude berichten opschonen (elke dag)
        cleanOldMessages();
        setInterval(cleanOldMessages, 24 * 60 * 60 * 1000);
        
        messageInput.addEventListener('input', () => {
            if (myUsername && messageInput.value.trim().length > 0) {
                startTyping();
            } else {
                stopTyping();
            }
        });
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && messageInput.value.trim() && myUsername) {
                sendMessage();
            }
        });
        
        sendBtn.addEventListener('click', () => {
            if (messageInput.value.trim() && myUsername) {
                sendMessage();
            }
        });
        
        document.getElementById('disclaimerBtn').addEventListener('click', showDisclaimer);
        toggleSidebarBtn.addEventListener('click', toggleSidebar);
        
        // Check of er een naam is opgeslagen
        const hasName = loadUsernameFromStorage();
        if (!hasName) {
            showModal();
        } else {
            enableChat();
            registerUser();
            setupTypingListener();
            addSystemMessage(`👋 Welkom terug ${myUsername}!`);
        }
    }
    
    // Start alles
    init();
</script>
</body>
</html>
