<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalChat - Chat met Iedereen Wereldwijd</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        /* Licht thema (standaard) */
        :root {
            --bg-gradient-start: #6e8efb;
            --bg-gradient-end: #a777e3;
            --container-bg: rgba(255,255,255,0.95);
            --chat-bg: #f5f7ff;
            --user-msg-start: #4a6cf7;
            --user-msg-end: #7a52d4;
            --other-msg-bg: white;
            --other-msg-border: #ddd;
            --text-color: #333;
            --input-bg: white;
            --input-border: #ddd;
            --sidebar-bg: #f0f5ff;
            --online-badge: #4cd964;
            --system-color: #888;
        }
        
        /* Donker thema */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient-start: #1a1a2e;
                --bg-gradient-end: #16213e;
                --container-bg: rgba(30,30,46,0.95);
                --chat-bg: #1e1e2e;
                --user-msg-start: #4a6cf7;
                --user-msg-end: #7a52d4;
                --other-msg-bg: #2d2d3f;
                --other-msg-border: #404055;
                --text-color: #e0e0e0;
                --input-bg: #2d2d3f;
                --input-border: #404055;
                --sidebar-bg: #252538;
                --online-badge: #4cd964;
                --system-color: #aaa;
            }
        }
        
        body { 
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end)); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 0; 
            margin: 0; 
        }
        
        .container { 
            width: 100%; 
            max-width: 1200px; 
            height: 100vh;
            max-height: 100vh;
            background: var(--container-bg); 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }
        
        .header { 
            background: linear-gradient(90deg, #4a6cf7, #7a52d4); 
            color: white; 
            padding: 15px 20px;
            text-align: center; 
            position: relative; 
        }
        
        .header-buttons {
            position: absolute;
            top: 10px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        
        .disclaimer-btn {
            background: rgba(0,0,0,0.4);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .disclaimer-btn:hover {
            background: rgba(0,0,0,0.6);
        }
        
        .online-status { 
            position: absolute; 
            top: 10px; 
            right: 20px; 
            background: rgba(0,0,0,0.4); 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        
        .status-dot { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            background: var(--online-badge); 
            animation: pulse 1.5s infinite; 
        }
        
        @keyframes pulse { 
            0% { opacity: 0.4; transform: scale(0.8); } 
            100% { opacity: 1; transform: scale(1.2); } 
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--input-border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .user-info {
            padding: 15px;
            border-bottom: 1px solid var(--input-border);
        }
        
        .username-input {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .username-input input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--text-color);
        }
        
        .username-input button {
            padding: 8px 12px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .current-username {
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
            padding: 8px;
            background: var(--input-bg);
            border-radius: 8px;
            word-break: break-all;
        }
        
        .online-users {
            flex: 1;
            padding: 15px;
        }
        
        .online-users h3 {
            margin-bottom: 10px;
            font-size: 1rem;
            color: var(--text-color);
        }
        
        .user-list {
            list-style: none;
        }
        
        .user-list li {
            padding: 8px;
            margin-bottom: 5px;
            background: var(--input-bg);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-color);
            font-size: 0.9rem;
        }
        
        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--online-badge);
            display: inline-block;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 15px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--input-border);
            color: var(--text-color);
        }
        
        .chat-header h3 {
            font-size: 1rem;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--chat-bg);
        }
        
        .message {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 18px;
            position: relative;
            color: var(--text-color);
            word-wrap: break-word;
        }
        
        .message-user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--user-msg-start), var(--user-msg-end));
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message-other {
            align-self: flex-start;
            background: var(--other-msg-bg);
            border: 1px solid var(--other-msg-border);
            border-bottom-left-radius: 5px;
        }
        
        .message-system {
            align-self: center;
            background: var(--system-color);
            color: white;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 20px;
            max-width: 90%;
            text-align: center;
            opacity: 0.7;
        }
        
        .message-info {
            font-size: 0.7rem;
            margin-bottom: 5px;
            opacity: 0.8;
        }
        
        .message-user .message-info {
            color: rgba(255,255,255,0.8);
        }
        
        .message-time {
            font-size: 0.65rem;
            margin-top: 5px;
            opacity: 0.6;
        }
        
        .input-container { 
            display: flex; 
            padding: 15px; 
            background: var(--input-bg); 
            border-top: 1px solid var(--input-border); 
        }
        
        #message-input { 
            flex: 1; 
            padding: 12px 15px; 
            border: 1px solid var(--input-border); 
            border-radius: 25px; 
            outline: none; 
            background: var(--input-bg);
            color: var(--text-color);
        }
        
        #send-btn { 
            background: linear-gradient(135deg, #4a6cf7, #7a52d4); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            margin-left: 10px; 
            cursor: pointer; 
            font-size: 1.2rem;
        }
        
        .typing-indicator {
            align-self: flex-start;
            background: var(--other-msg-bg);
            padding: 8px 15px;
            border-radius: 18px;
            font-style: italic;
            font-size: 0.8rem;
            color: var(--text-color);
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 220px;
            }
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-buttons">
            <button class="disclaimer-btn" id="disclaimerBtn">⚠️ Disclaimer</button>
        </div>
        <div class="online-status">
            <div class="status-dot"></div>
            <span id="connectionLabel">Verbinden...</span>
        </div>
        <h1>🌍 GlobalChat</h1>
        <p>Chat met iedereen die online is</p>
    </div>
    
    <div class="main-content">
        <div class="sidebar">
            <div class="user-info">
                <strong>👤 Jouw naam:</strong>
                <div class="username-input">
                    <input type="text" id="usernameInput" placeholder="Kies een gebruikersnaam" maxlength="20">
                    <button onclick="setUsername()">Set</button>
                </div>
                <div class="current-username" id="currentUsernameDisplay">Nog niet ingesteld</div>
            </div>
            
            <div class="online-users">
                <h3>📡 Online nu (<span id="onlineCount">0</span>)</h3>
                <ul class="user-list" id="userList">
                    <li>Laden...</li>
                </ul>
            </div>
        </div>
        
        <div class="chat-area">
            <div class="chat-header">
                <h3>💬 Wereldwijde chat</h3>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message message-system">
                    Stel je gebruikersnaam in om te chatten!
                </div>
            </div>
            <div class="input-container">
                <input type="text" id="message-input" placeholder="Typ je bericht..." disabled>
                <button id="send-btn" disabled>➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== FIREBASE CONFIG ==========
    const firebaseConfig = {
        apiKey: "AIzaSyAVSuvwfb2K9HlkgmBhX0wb6qIAh7zG6G68",
        authDomain: "smartbot-e74c8.firebaseapp.com",
        databaseURL: "https://smartbot-e74c8-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "smartbot-e74c8",
        storageBucket: "smartbot-e74c8.firebasestorage.app",
        messagingSenderId: "763220149613",
        appId: "1:763220149613:web:ca15bf820a309ff7adc664"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Referenties
    const messagesRef = db.ref('globalchat/messages');
    const usersRef = db.ref('globalchat/users');
    const typingRef = db.ref('globalchat/typing');
    
    // Variabelen
    let myUsername = null;
    let myUserId = null;
    let typingTimeout = null;
    let isTyping = false;
    
    // DOM elementen
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const userList = document.getElementById('userList');
    const currentUsernameDisplay = document.getElementById('currentUsernameDisplay');
    const connectionLabel = document.getElementById('connectionLabel');
    const statusDot = document.querySelector('.status-dot');
    const onlineCountSpan = document.getElementById('onlineCount');
    
    // ========== GEBRUIKERSNAAM INSTELLEN ==========
    function setUsername() {
        const username = document.getElementById('usernameInput').value.trim();
        if (!username) {
            addSystemMessage('❌ Voer een geldige gebruikersnaam in!');
            return;
        }
        
        if (username.length > 20) {
            addSystemMessage('❌ Gebruikersnaam mag maximaal 20 tekens zijn!');
            return;
        }
        
        myUsername = username;
        myUserId = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        currentUsernameDisplay.textContent = myUsername;
        document.getElementById('usernameInput').value = '';
        
        // Schakel chat in
        messageInput.disabled = false;
        sendBtn.disabled = false;
        
        addSystemMessage(`✅ Welkom ${myUsername}! Je bent nu online.`);
        
        // Registreer gebruiker
        registerUser();
        
        // Start typing indicator listener
        setupTypingListener();
    }
    
    // ========== GEBRUIKER REGISTRATIE ==========
    function registerUser() {
        const userRef = usersRef.child(myUserId);
        userRef.set({
            username: myUsername,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
        
        // Verwijder bij sluiten
        window.addEventListener('beforeunload', () => {
            userRef.remove();
        });
        
        // Update regelmatig
        setInterval(() => {
            if (myUserId) {
                usersRef.child(myUserId).update({
                    lastSeen: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }, 15000);
    }
    
    // ========== BERICHTEN VERSTUREN ==========
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        if (!myUsername) {
            addSystemMessage('❌ Stel eerst je gebruikersnaam in!');
            return;
        }
        
        const message = {
            text: text,
            username: myUsername,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            userId: myUserId
        };
        
        messagesRef.push(message);
        messageInput.value = '';
        
        // Stop typing indicator
        stopTyping();
    }
    
    // ========== BERICHTEN ONTVANGEN ==========
    function setupMessageListener() {
        messagesRef.limitToLast(100).on('child_added', (snapshot) => {
            const message = snapshot.val();
            if (message.userId === myUserId) return; // Eigen bericht overslaan
            addMessage(message.text, false, message.username, message.timestamp);
        });
        
        // Laatste 50 berichten laden bij start
        messagesRef.limitToLast(50).once('value', (snapshot) => {
            const messages = [];
            snapshot.forEach((child) => {
                messages.push(child.val());
            });
            messages.reverse().forEach(msg => {
                if (msg.userId !== myUserId) {
                    addMessage(msg.text, false, msg.username, msg.timestamp);
                }
            });
        });
    }
    
    // ========== ONLINE GEBRUIKERS ==========
    function setupUserListener() {
        usersRef.on('value', (snapshot) => {
            const users = snapshot.val() || {};
            const now = Date.now();
            const onlineUsers = [];
            
            for (const [id, data] of Object.entries(users)) {
                // Check of gebruiker online is (laatste 30 seconden)
                const lastSeen = data.lastSeen;
                const isOnline = lastSeen && (now - lastSeen < 30000);
                
                if (isOnline && id !== myUserId) {
                    onlineUsers.push(data.username);
                }
            }
            
            // Update UI
            onlineCountSpan.textContent = onlineUsers.length;
            
            if (onlineUsers.length === 0) {
                userList.innerHTML = '<li>👤 Geen andere gebruikers online</li>';
            } else {
                userList.innerHTML = onlineUsers.map(username => `
                    <li>
                        <span><span class="online-dot"></span>${escapeHtml(username)}</span>
                        <span style="font-size:0.7rem;">online</span>
                    </li>
                `).join('');
            }
        });
        
        // Verwijder offline gebruikers (ouder dan 30 seconden)
        setInterval(() => {
            const cutoff = Date.now() - 30000;
            usersRef.once('value', (snapshot) => {
                const users = snapshot.val() || {};
                for (const [id, data] of Object.entries(users)) {
                    if (data.lastSeen && data.lastSeen < cutoff) {
                        usersRef.child(id).remove();
                    }
                }
            });
        }, 10000);
    }
    
    // ========== TYPING INDICATOR ==========
    function setupTypingListener() {
        typingRef.on('value', (snapshot) => {
            const typingData = snapshot.val() || {};
            let someoneTyping = false;
            let typingUsername = '';
            
            for (const [id, data] of Object.entries(typingData)) {
                if (id !== myUserId && data.isTyping && (Date.now() - data.timestamp < 3000)) {
                    someoneTyping = true;
                    typingUsername = data.username;
                    break;
                }
            }
            
            // Verwijder oude typing indicators
            const oldIndicator = document.getElementById('global-typing-indicator');
            if (oldIndicator) oldIndicator.remove();
            
            if (someoneTyping) {
                const typingDiv = document.createElement('div');
                typingDiv.id = 'global-typing-indicator';
                typingDiv.className = 'typing-indicator';
                typingDiv.textContent = `✏️ ${escapeHtml(typingUsername)} is aan het typen...`;
                chatMessages.appendChild(typingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        });
    }
    
    function startTyping() {
        if (!myUserId || !myUsername) return;
        
        if (!isTyping) {
            isTyping = true;
            typingRef.child(myUserId).set({
                username: myUsername,
                isTyping: true,
                timestamp: Date.now()
            });
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                stopTyping();
            }, 2000);
        }
    }
    
    function stopTyping() {
        if (myUserId) {
            typingRef.child(myUserId).remove();
            isTyping = false;
        }
    }
    
    // ========== UI FUNCTIES ==========
    function addMessage(text, isUser, username, timestamp) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'message-user' : 'message-other'}`;
        
        const infoSpan = document.createElement('div');
        infoSpan.className = 'message-info';
        infoSpan.textContent = isUser ? (myUsername || 'Jij') : (username || 'Onbekend');
        
        const textSpan = document.createElement('div');
        textSpan.textContent = text;
        
        const timeSpan = document.createElement('div');
        timeSpan.className = 'message-time';
        if (timestamp) {
            const date = new Date(timestamp);
            timeSpan.textContent = `${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
        }
        
        messageDiv.appendChild(infoSpan);
        messageDiv.appendChild(textSpan);
        if (timestamp) messageDiv.appendChild(timeSpan);
        
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function addSystemMessage(text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message message-system';
        messageDiv.textContent = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        // Verwijder na 5 seconden
        setTimeout(() => {
            if (messageDiv.remove) messageDiv.remove();
        }, 5000);
    }
    
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    
    // ========== VERBINDINGSSTATUS ==========
    function setupConnectionStatus() {
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if (snap.val()) {
                connectionLabel.innerHTML = '✅ Online';
                if (statusDot) statusDot.style.backgroundColor = '#4cd964';
                if (myUsername) {
                    addSystemMessage('🌍 Verbonden met wereldwijde chat!');
                    registerUser();
                }
            } else {
                connectionLabel.innerHTML = '❌ Offline';
                if (statusDot) statusDot.style.backgroundColor = '#ff3b30';
                addSystemMessage('⚠️ Geen verbinding. Berichten worden niet verzonden.');
                messageInput.disabled = true;
                sendBtn.disabled = true;
            }
        });
    }
    
    // ========== DISCLAIMER ==========
    function showDisclaimer() {
        window.open('disclaimer.txt', '_blank');
    }
    
    // ========== INITIALISATIE ==========
    function init() {
        setupConnectionStatus();
        setupUserListener();
        setupMessageListener();
        
        messageInput.addEventListener('input', () => {
            if (myUsername) {
                startTyping();
            }
        });
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && messageInput.value.trim() && myUsername) {
                sendMessage();
            }
        });
        
        sendBtn.addEventListener('click', () => {
            if (messageInput.value.trim() && myUsername) {
                sendMessage();
            }
        });
        
        document.getElementById('disclaimerBtn').addEventListener('click', showDisclaimer);
        
        // Enter in username field
        document.getElementById('usernameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') setUsername();
        });
        
        addSystemMessage('💬 Welkom bij GlobalChat! Stel je gebruikersnaam in om te beginnen.');
    }
    
    // Start alles
    init();
</script>
</body>
</html>
